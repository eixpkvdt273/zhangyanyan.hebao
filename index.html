  /* 20261021 批次B：未收录疾病的 AI 参考结论（虚线隔离，视觉上必须区别于规则结论） */

  .follow-up b { color: #1e40af; }

<body>
<header>
  <h1>🛡️ 核保小助手 5.0</h1>
  <div class="sub">投保前先查一查 · 覆盖 566 种疾病</div>
  <div class="intro">上传报告、粘贴文字、对话聊天，三种方式任您选</div>
</header>

<div id="chat"></div>

<div class="examples">
  试试：<span onclick="quick(this)">我35岁，有甲状腺结节，想买重疾险</span>
  <span onclick="quick(this)">原发性高血压，收缩压190，舒张压80</span>
  <span onclick="quick(this)">我28岁，乙肝小三阳，买医疗险</span>
  <span onclick="quick(this)">胸闷</span>
</div>

<div id="inputBar">
  <input id="msg" placeholder="请描述您的情况，例如：我35岁，有甲状腺结节，想买重疾险" onkeydown="if(event.key==='Enter')send()">
  <button class="btn btn-send" onclick="send()">发送</button>
  <button class="btn btn-up" onclick="uploadImg()">📷 上传图片</button>
  <button class="btn btn-up" onclick="openPaste()">📋 粘贴文字</button>
  <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="onImgSelected(event)">
  <button class="btn btn-up" onclick="resetChat()">🗑 清空</button>
</div>

<div id="loading"><div>正在识别…<div class="bar"><i id="prog"></i></div></div></div>

<div id="modal">
  <div class="box">
    <h3>粘贴报告文字内容</h3>
    <textarea id="pasteArea" placeholder="将体检报告、出院小结、病历等文字粘贴到这里…"></textarea>
    <div class="acts">
      <button class="btn btn-up" onclick="closePaste()">取消</button>
      <button class="btn btn-send" onclick="doPaste()">分析</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="material.js"></script>
<script>
/* ============== 规则数据（注入点） ============== */

/* RULES -> 已抽取至 data.js */


/* ============== 基础工具 ============== */
/* 结论等级严格度（从高到低）：拒保 > 延期 > 加费 > 除外 > 标体。
   "转人工" 是「处置方式」而非「结论等级」，不参与严格度比较，单独作为标志位处理（见 combineConclusions）。 */

/* RISK -> 已抽取至 data.js */

/* 增额寿「有承保可能性，需结合保额和投保阶段评估」特殊结论：非标准结论等级，仅用于展示与提示，不参与严格度排序 */

/* SPECIAL_EEV -> 已抽取至 data.js */


/* SPECIAL_EEV_SHORT -> 已抽取至 data.js */

function dispConclusion(v){ return (v===SPECIAL_EEV)? SPECIAL_EEV_SHORT : v; }

/* FIELD_ALIASES -> 已抽取至 data.js */

function normField(k){ if(k==null) return ""; k=String(k).trim(); if(k in FIELD_ALIASES) return FIELD_ALIASES[k]; for(const a in FIELD_ALIASES){ if(k.indexOf(a)>=0) return FIELD_ALIASES[a]; } return k; }
function norm(s){ return String(s==null?"":s).replace(/\s+/g,""); }
function extractNum(s){ const m=String(s).match(/(\d+(?:\.\d+)?)/); return m?parseFloat(m[1]):null; }
function compare(v,op,t){ op={"≥":">=","≤":"<=","＞":">","＜":"<",">":">","<":"<"}[op]||op; if(op===">=")return v>=t; if(op==="<=")return v<=t; if(op===">")return v>t; if(op==="<")return v<t; return false; }
function stripParen(s){ return norm(s).replace(/[（(].*?[)）]/g,""); }
function diseaseMatch(user,rule){ const u=norm(user),r=norm(rule); if(!u||!r)return false; if(u===r)return true; if(u===stripParen(r))return true; return u.indexOf(r)>=0||r.indexOf(u)>=0; }

/* 所有疾病名（去重），用于信息提取时匹配 */
const DISEASES = (function(){ const seen=new Set(); const arr=[]; for(const r of RULES){ if(r.disease&&!seen.has(r.disease)){ seen.add(r.disease); arr.push(r.disease); } } return arr; })();

/* ============== 疾病名标准化映射层（用户输入 → 规则库标准名） ==============
   匹配流程：用户输入 → 查 DISEASE_MAP → 有映射用标准名匹配；无映射用原名。
   注意：仅保留「映射目标能解析到真实规则名」的重定向（ACTIVE_DISEASE_MAP），
   避免把用户词误映射到不存在的病；用户词"血压高"已按需求改映射到"原发性高血压"（库内存在）。
   labelMap 用于把归一化后的标准名还原回用户原词做展示。 */

/* DISEASE_MAP -> 已抽取至 data.js */

/* 把 DISEASE_MAP 的 key 解析到真实规则病名；仅保留能解析成功的重定向 */
const ACTIVE_DISEASE_MAP = {};   // key(用户词) -> 真实规则病名
const LABEL_MAP = {};            // 真实规则病名 -> 用户原词（用于展示）
(function buildActiveMap(){
  for(const key in DISEASE_MAP){
    const target = DISEASE_MAP[key];
    if(target===key) continue;                 // 自映射（如 甲状腺结节→甲状腺结节）跳过，避免改写文本
    let actual=null;
    for(const d of DISEASES){ if(diseaseMatch(target, d)){ actual=d; break; } }
    if(actual){ ACTIVE_DISEASE_MAP[key]=actual;
      // 展示名优先取【中文】用户原词、其次取最短（如 高血压 优于 高血压病；宫颈上皮内瘤变 优于 CIN 缩写）
      const old=LABEL_MAP[actual];
      const isCJK=k=>/[\u4e00-\u9fa5]/.test(k);
      const better=!old || (isCJK(key)!==isCJK(old) ? isCJK(key) : key.length < old.length);
      if(better) LABEL_MAP[actual]=key;
    }
  }
})();
// 心电图异常类：多个口语词（T波倒置/ST段压低/T波改变）同映射到 st段或T波异常，
// 统一用规范展示名，避免 LABEL_MAP 取最短 key 导致显示成「T波倒置」
LABEL_MAP["st段或T波异常"] = "ST段或T波异常";
// 新增「子宫异位/子宫异位症」简称后，最短 key 会抢占展示名，故锁定子宫内膜异位症的标准显示名
LABEL_MAP["子宫内膜异位症"] = "子宫内膜异位症";
/* 安全替换：把文本中的用户词替换为标准病名。
   - 扫描所有 DISEASE_MAP key，取【最长】匹配（如"乙肝大三阳"优先于"乙肝"，避免把"乙肝"误替换进"乙肝大三阳"）
   - 仅当匹配到的 key 属于 ACTIVE_DISEASE_MAP（能解析到真实规则）时才替换；自映射 key 仅作占位，不替换
   - 保护前缀：匹配位置紧邻"妊娠/原发性/继发性"时不替换，避免"糖尿病"被替换进"妊娠糖尿病"、"高血压"被二次替换进"原发性高血压"
   LABEL_MAP 为模块级，渲染时按 disease 取展示名 */
function applyDiseaseMap(text){
  let out="", i=0;
  const T=text.length;
  while(i<T){
    let matched=null, mlen=0;
    for(const key in DISEASE_MAP){               // 用全部 key（含自映射）取最长，防止短前缀误伤
      if(text.startsWith(key, i) && key.length>mlen){ matched=key; mlen=key.length; }
    }
    if(matched && ACTIVE_DISEASE_MAP[matched]){
      // ASCII 缩写键（如 CIN）需前后为非字母数字边界，避免误伤英文单词（如 VACCINE）
      const isAsciiKey=/[A-Za-z]/.test(matched);
      const prev=i>0?text[i-1]:""; const next=text[i+mlen]||"";
      const boundaryOk = !isAsciiKey || (!/[A-Za-z0-9]/.test(prev) && !/[A-Za-z0-9]/.test(next));
      const ctx = text.slice(Math.max(0,i-3), i);
      const isProtected = ctx.endsWith("妊娠") || ctx.endsWith("原发性") || ctx.endsWith("继发性");
      if(boundaryOk && !isProtected){ out += stripParen(ACTIVE_DISEASE_MAP[matched]); i += mlen; continue; }  // 用规范的去括号病名替换，保持文本整洁
    }
    out += text[i]; i++;
  }
  return out;
}

/* 常见疾病名前缀（用户描述常省略，如"原发性高血压"省略为"高血压"）。

    if(q.indexOf("血压")>=0||q.indexOf("收缩压")>=0||q.indexOf("舒张压")>=0){ if(!prov.has("收缩压")||!prov.has("舒张压")) miss.push(q); continue; }

  // 严格匹配
  const full=cands.filter(r=>ruleMatches(r, info));
  if(full.length===1) return {status:"full_match", rule:full[0], missing:null};
  if(full.length>1){ full.sort((a,b)=> (b.conditions.length-a.conditions.length) || (strictScore(b)-strictScore(a))); return {status:"full_match", rule:full[0], missing:null}; }
  /* 批次C-批1B：分级信号读不懂 → 强制转人工（分级未识别），禁止落入宽松兜底（宽松兜底是 4a 类宽结论的根因路径）。 */
  if(info.indicators && info.indicators["分级未识别"]==="是"){
    const _needGrade=(cands||[]).some(r=>(r.conditions||[]).some(c=>String(c.q||"").indexOf("分级")>=0));
    if(_needGrade){
      return { status:"full_match", rule:{ system:"_synthetic", disease:dname, icd:"", conditions:[],
        conclusions:{"医疗险":"转人工（分级未识别）","重疾险":"转人工（分级未识别）","增额寿":"转人工（分级未识别）"},
        remarks:"检测到分级表述（如 TI-RADS/分级）但无法解析具体级别，为避免宽松误判，须人工核保确认分级后出具结论。" }, missing:null };
    }
  }
  // best-effort：信息不全时，选 满足最多条件 > 良性路径(非拒保/延期) > 风险最宽松 的规则作初步参考
  let best=null, bestRank=null;
  const rankOf=(r)=>{
    let sat=0; for(const c of r.conditions){ if(condMatches(c,info)) sat++; }
    const concl=Object.values(r.conclusions);
    const manual=concl.some(v=>v==="转人工");
    const benign=!concl.some(v=>v==="拒保"||v==="延期");
    const friendly = manual ? 100 : (concl.some(v=>v==="通过"||v==="标体")?0:strictScore(r));
    // 信息不足兜底排序：满足条件多 > 良性(非拒保/延期) > 非转人工 > 风险最宽松。
    // 注意「良性」必须排在「非转人工」之前，否则「拒保」规则会压过「转人工」规则（转人工被错误展示为拒保）。
    return [-sat, benign?0:1, manual?1:0, friendly];
  };
  const less=(a,b)=>{ for(let i=0;i<a.length;i++){ if(a[i]<b[i]) return true; if(a[i]>b[i]) return false; } return false; };
  for(const r of cands){
    const rk=rankOf(r);
    if(best===null || less(rk,bestRank)){ best=r; bestRank=rk; }
  }
  const miss=missingFields(collectQuestions(cands), info);
  return {status:"reference", rule:best, missing:miss};
}

/* 20261021 批次C-批2：无诊断指标异常识别（保守形态：AI抽取标记段 + 数值箭头/加号型；排除否定语境与检查问询词） */
function detectLabAbnormal(text){
  const out=[]; const seen=new Set();
  const add=(s)=>{ s=String(s||"").trim(); if(s.length<2||s.length>30) return;
    if(/无异常|未见异常|未见明显异常|正常|阴性|否认/.test(s)) return;
    if(CHECK_NO_RULE.some(w=>s.indexOf(w)>=0)) return;
    if(!seen.has(s)){ seen.add(s); out.push(s); } };
  const m=text.match(/（异常指标：([^）]*)）/);
  if(m) m[1].split(/[；;]/).forEach(add);
  let re=/([^\s，。；、（）()！？!?]{1,24}(?:\+\+|\d\s*[+＋](?!\d)|↑|↓))/g, x;   /* C8: 补单加号 数字+ 形态（前缀含非数字防"2+3"数学式误伤） */
  let re2b=/((?:尿蛋白|尿潜血|尿隐血|尿糖|尿胆原|酮体|亚硝酸盐)\s*[+＋]{1,3})/g;   /* C8: 尿常规项白名单裸加号（零误伤，血型O+/AB+不匹配） */
  while((x=re2b.exec(text))) add(x[1]);
  while((x=re.exec(text))) add(x[1]);
  /* 来源3：文字型（…升高/偏高/增高/强阳性/阳性）。粗搜命中→不收（库内病名自走疾病路径）；
     无指标特征词→放行（防"体重升高"等误伤）。跨一个空格窗口以覆盖"CEA 8.5升高"式手打。 */
  let re3=/((?:[^\s，。；、（）()！？!?]{1,16}[ \t]?){1,3}(?:升高|偏高|增高|强阳性|阳性))/g;
  while((x=re3.exec(text))){
    const _s=x[1];
    if(_s.indexOf("异常指标")>=0) continue;   /* 标记段已单独抓取，防重复 */
    if(CHECK_NO_RULE.some(w=>_s.indexOf(w)>=0)) continue;
    /* C8: 删"粗搜命中即跳过"——识别层不做路由决定；命中与否由调用方分桶（旧逻辑使"尿糖阳性/肌酐升高/肿瘤标志物升高"静默消失） */
    if(/酶|抗原|蛋白|激素|胆红素|肌酐|尿酸|血糖|血脂|白细胞|血小板|血红蛋白|潜血|隐血|尿糖|抗体|标志物|指标|CEA|AFP|CA\d|PSA|TSH|氨酸|血沉|二聚体|铁蛋白/i.test(_s)) add(_s);
  }

}

  if(m) r.push({type:"24h动态血压(均值)", sb:parseInt(m[1]), db:parseInt(m[2])});

function specialExamGuidance(exams){

// 肿瘤及 ICD-10 识别
function detectTumorICD(text){
  const kws=["恶性肿瘤","癌","肉瘤","母细胞瘤","占位","白血病","淋巴瘤","骨髓瘤","转移癌","转移瘤","复发","晚期","TNM","原位癌","CIN3","浸润"];

  const _stripped=String(text||"").replace(/(癌胚抗原|糖类抗原|癌抗原|肿瘤标志物|肿瘤指标|CA-?\d{2,4})/g,"");
  const terms=kws.filter(k=>_stripped.indexOf(k)>=0);
  const icd=(text.match(/C\d{2}(\.\d{1,2})?/g)||[]);
  return { has: terms.length>0||icd.length>0, terms, icd };

// 对话状态管理（localStorage 会话）
const SKEY="ub_session_v3";
function loadSession(){ try{ return JSON.parse(localStorage.getItem(SKEY)||"{}"); }catch(e){ return {}; } }
function saveSession(s){ try{ localStorage.setItem(SKEY, JSON.stringify(s)); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem(SKEY); }catch(e){} }
/* 对话管理：记录最近一次「症状/检查异常」追问上下文，供用户补充信息时关联上一轮 */
function saveAskContext(ask){ if(!ask) return; const s=loadSession(); s.lastAsk=ask; s.lastAskTs=Date.now(); saveSession(s); }
function loadAskContext(){ const s=loadSession(); return (s.lastAsk && Date.now()-s.lastAskTs < 30*60*1000) ? s.lastAsk : null; }
/* 判断本轮输入是否是对上一轮追问的补充（如「做了心电图，正常」「医生说没问题」）：
   命中检查/诊断/结果关键词，且未引入新的明确疾病、新症状、新检查异常 → 视为上下文延续 */
function isContinuationReply(text){
  const hasNewDisease = findDiseaseSpans(applyDiseaseMap(text)).length>0;
  const hasNewSymptom = detectSymptoms(text).length>0;
  const hasNewCheck = detectCheckNoRule(text).length>0;
  if(hasNewDisease||hasNewSymptom||hasNewCheck) return false;
  return /心电图|CT|核磁|MRI|B超|超声|胸片|血常规|尿常规|化验|检查|报告|指标|医生说|医生.*诊断|诊断是|结果是|结果.*正常|结果.*异常|正常|异常|复查|确诊|还没|做了|没做/.test(text);
}

/* ================================================================
   胸闷症状追问上下文管理器（试点，仅启用"胸闷"，其余症状零影响）
   —— 等价实现 symptom_context.py，只读复用现有 DISEASE 匹配，不改任何底层。
   安全开关：把 ENABLED_SYMPTOMS 改成 [] 即整体关闭本模块。
   ================================================================ */
const SYMPTOM_CTX = (function(){
  // ==================== 配置区（安全开关在此） ====================
  const ENABLED_SYMPTOMS = ["胸闷"];                 // [] = 关闭试点功能
  const MAX_ROUNDS = 5;
  const CTX_TTL = 30*60*1000;                        // 上下文有效期 30 分钟（与 lastAsk 的 TTL 一致），超时自动失效
  // 两阶段追问话术（create / 重问 / ask_diagnosis 共用，保证同一问题文案一致）
  const ASK_CHECK = "请问您是否做过相关检查？如心电图、心脏彩超、胸片、CT等？结果如何？";
  const ASK_DIAGNOSIS = "请问医生当时具体是怎么说的？比如有没有提到具体的病名（如冠心病、心肌炎等）？";

  // 别名 → 标准名（与 symptom_context.py 的 ALIAS_MAP 一致）
  const ALIAS_MAP = {
    "冠心病":"冠状动脉粥样硬化性心脏病",
    "心绞痛":"心绞痛",
    "心肌梗死":"心肌梗死",
    "心梗":"心肌梗死",
    "心肌炎":"心肌炎",
    "心律失常":"心律失常",
    "房颤":"心房颤动",
    "早搏":"期前收缩",
    "心脏瓣膜病":"心脏瓣膜病",
    "心衰":"心力衰竭",
    "心力衰竭":"心力衰竭",
    "心肌缺血":"心肌缺血",
    "冠脉":"冠状动脉粥样硬化性心脏病",
    "支架":"冠状动脉粥样硬化性心脏病",
    "搭桥":"冠状动脉粥样硬化性心脏病",
    "st段":"心肌缺血",
    "t波":"心肌缺血",
  };
  // 识别用户回复中的明确诊断词（白名单 = 别名键，含中文别名）
  const RELATED = Object.keys(ALIAS_MAP);

  const NO_DIAGNOSIS_PATTERNS = [
    "没什么","没问题","未见异常","正常","无异常",
    "没开药","不用药","没吃药","不用治疗",
    "没诊断","没有明确","定期观察","复查",
    "医生说没事","不需要治疗","不是病","无需处理"
  ];

  // ========== 泛称映射表：笼统病名 → 具体分型（命中后定向追问“具体是哪一种”）==========
  const GENERIC_DISEASE_MAP = {
    "心脏病": ["冠心病", "风湿性心脏病", "瓣膜性心脏病", "高血压性心脏病", "肺原性心脏病", "先天性心脏病"],
    "胃病": ["胃炎", "胃溃疡", "胃息肉", "胃穿孔", "胃出血"],
    "肝病": ["脂肪肝", "肝炎", "肝硬化", "肝囊肿", "肝血管瘤"],
    "肾病": ["肾炎", "肾结石", "肾囊肿", "肾功能不全"],
    "肺病": ["肺炎", "肺结核", "肺结节", "慢阻肺", "肺气肿"],
    "妇科病": ["子宫肌瘤", "卵巢囊肿", "宫颈炎", "盆腔炎"],
  };
  function detectGenericDisease(t){
    const s=String(t);
    for(const key of Object.keys(GENERIC_DISEASE_MAP)){
      if(s.indexOf(key) >= 0) return key;
    }
    return null;
  }

  // ==================== 上下文存取（复用现有 localStorage 会话） ====================
  const _ctx = () => { const s=loadSession(); return (s && s.symptomCtx) || null; };
  const _set = (c) => { const s=loadSession(); s.symptomCtx=c; saveSession(s); };
  // 过期判定：以最后一次交互时间为准；无时间戳的历史遗留上下文一律视为过期并清理
  const isActive = () => {
    const c=_ctx();
    if(!c || !c.active) return false;
    const t = c.lastTs || c.ts || 0;
    if(!t || Date.now()-t >= CTX_TTL){ c.active=false; c.stage="expired"; _set(c); return false; }
    return true;
  };

  function create(symptom){
    _set({ active:true, symptom:symptom, stage:"ask_check", checkResult:null, round:0, ts:Date.now(), lastTs:Date.now() });
    return ASK_CHECK;
  }
  function release(){
    const c=_ctx(); if(c){ c.active=false; c.stage="completed"; _set(c); }
    const s=loadSession(); s.symptomCtxJustReleased=true; saveSession(s);
  }

  function isNoDiagnosis(t){ const s=String(t).toLowerCase(); return NO_DIAGNOSIS_PATTERNS.some(p=>s.indexOf(p)>=0); }
  function matchDisease(t){ const s=String(t).toLowerCase(); for(const k of RELATED){ if(s.indexOf(k.toLowerCase())>=0) return k; } return null; }

  // ========== 规则引擎触发：解析为真实规则库病名（复用现有 dedupeToKnown），解析不到则原样交回 analyze 兜底 ==========
  function resolveRuleName(alias){
    const canon = dedupeToKnown([alias, ALIAS_MAP[alias]||alias]);
    return canon[0] || (ALIAS_MAP[alias]||alias);
  }
  // ========== 兜底话术（等价 _call_fallback；生理性/无器质性诊断） ==========
  function fallbackReply(){
    return "根据您提供的信息，医生已确认检查结果无异常，且无器质性诊断。此类生理性症状通常不影响投保。建议您保留完整检查资料，如有明确诊断后可重新评估。";
  }

  function handle(text){
    const c=_ctx();
    if(!c || !c.active) return { handled:false };
    if(c.round >= MAX_ROUNDS){ release(); return { handled:false }; }
    c.lastTs = Date.now();
    // 【根因C】输入本身是症状词/疾病词，而不是对上一问的回答 → 不推进状态、不消耗轮次，重问当前这一问
    if(isDiseaseInput(text) || detectSymptoms(text).length>0){
      _set(c);
      return { handled:true, reply: (c.stage==="ask_check" ? ASK_CHECK : ASK_DIAGNOSIS) };
    }
    c.round += 1;

    if(c.stage === "ask_check"){
      c.checkResult = text; c.stage = "ask_diagnosis"; _set(c);
      // 【已有】提前匹配诊断：用户可能在回答检查结果时直接说出具体病名，命中则直接退出追问
      const m = matchDisease(text);
      if(m){ release(); return { handled:true, rule:resolveRuleName(m) }; }
      // 【新增】泛称检测：用户说“心脏病/胃病”等笼统词，定向追问具体分型（不打断原逻辑）
      const genericMatch = detectGenericDisease(text);
      if(genericMatch){
        return { handled:true, reply:`您说的“${genericMatch}”比较笼统，具体是哪一种？如：${GENERIC_DISEASE_MAP[genericMatch].join("、")}。` };
      }
      return { handled:true, reply:"根据检查结果，医生有没有给出明确的诊断或怀疑方向？" };
    }
    if(c.stage === "ask_diagnosis"){
      _set(c);   // 落盘 round：此前该分支缺保存，round 恒为 1，MAX_ROUNDS 熔断从未触发 → 死循环
      if(isNoDiagnosis(text)){ release(); return { handled:true, reply:fallbackReply() }; }
      const m = matchDisease(text);
      if(m){ release(); return { handled:true, rule:resolveRuleName(m) }; }
      return { handled:true, reply:ASK_DIAGNOSIS };
    }
    return { handled:false };
  }

  // ========== 本轮输入是否本身命中规则库疾病 ==========
  // 复用引擎已有的疾病定位能力（applyDiseaseMap / EXTRA_ALIAS / findDiseaseSpans），
  // 只读调用，不新增词表、不修改定位逻辑。用于：用户换话题或直接说出病名时，
  // 不再把明确疾病当成对上一轮追问的回答。
  function isDiseaseInput(t){
    try{
      const norm = EXTRA_ALIAS.apply(applyDiseaseMap(String(t)));
      const spans = findDiseaseSpans(norm).filter(s=>!CHECK_SKIP_DISEASES.has(s.disease));
      return spans.length>0;
    }catch(e){ return false; }
  }

  // ========== 追问/兜底回复的最小独立卡片（不碰 renderCard 等） ==========
  function renderReply(text){
    const wrap=document.createElement("div"); wrap.className="row ai";
    const card=document.createElement("div"); card.className="card";
    card.innerHTML=`<div class="sec-title">追问 <span class="ai-badge">AI 辅助</span></div><div class="analysis">${escapeHtml(text)}</div>`;
    wrap.appendChild(card); chat.appendChild(wrap); scroll();
  }

  return { ENABLED_SYMPTOMS, isActive, create, handle, renderReply, isDiseaseInput, release };
})();

function applyCombo(perDisease){
  const diseases=perDisease.filter(p=>p.rule);
  if(diseases.length<2) return null;
  const cons={}; let manual=false;
  // 多疾病合并严格度：转人工参与从严比较（拒保 5 > 延期 4 > 转人工 3.5 > 加费 3 > 除外 2 > 标体/通过 1）
  const comboRisk=(v)=>{ v=String(v==null?"":v).trim(); if(!v) return 0; if(/^转人工/.test(v)) return 3.5; return RISK[v]||0; };
  for(const k of ["医疗险","重疾险","增额寿"]){
    let best=null,bv=0;
    for(const p of diseases){ let v=p.rule.conclusions[k]; if(v===SPECIAL_EEV) v="标体"; if(!v) continue; const rv=comboRisk(v); if(best===null||rv>bv){best=v;bv=rv;} }
    cons[k]=best||"标体";
    if(best && /^转人工/.test(best)) manual=true;
  }
  let comboNote="", multiNote="";
  const highRisk=diseases.some(p=>{ const dn=p.disease||""; return (dn.indexOf("甲状腺结节")>=0||dn.indexOf("乳腺结节")>=0)&&p.rule.conditions.some(c=>/≥4类|4类及以上/.test(c.a)); });
  const hasDM=diseases.some(p=>(p.disease||"").indexOf("血糖升高")>=0||(p.label||"").indexOf("糖尿病")>=0);
  const hasNod=diseases.some(p=>/(甲状腺|乳腺|肺)结节/.test(p.disease||""));
  if(hasDM&&hasNod){ cons["医疗险"]="拒保"; cons["重疾险"]="拒保"; comboNote="根据多疾病组合规则（糖尿病 + 结节）：医疗险与重疾险均直接拒保（糖尿病主导），增额寿险结合具体产品评估。"; }
  else if(highRisk){ cons["医疗险"]="延期"; cons["重疾险"]="延期"; comboNote="根据多疾病组合规则（高风险结节 4 类及以上主导）：医疗险与重疾险按「延期（需穿刺明确病理）」评估。"; }
  const chronic=diseases.filter(p=>/(血糖升高|高血压|乙肝|结节|息肉|增生)/.test(p.disease||"")).length;
  if(diseases.length>=3&&chronic>=1){
    multiNote="📌 您目前存在多项健康异常，核保评估通常比单一疾病更为谨慎。\n注：症状类（如胸闷、胸痛）需先提供心电图、心脏彩超等检查明确诊断；息肉、结节等术后部分保司要求满3-6个月再投保。";
  }
  let strict="标体";
  for(const k of ["医疗险","重疾险","增额寿"]){ let v=cons[k]; if(v===SPECIAL_EEV)v="标体"; if(/^转人工/.test(v)) manual=true; if(comboRisk(v)>comboRisk(strict)) strict=v; }
  return { combined:{manual,strict}, cons, comboNote, multiNote };
}
/* 风险改善指引（需求十五）：拒保/延期 结论时追加；full=true 为完整版（用户主动追问） */
function riskImprovement(perDisease, full){
  const diseases=perDisease.filter(p=>p.rule);
  if(!diseases.length) return "";
  const names=diseases.map(p=>p.disease||"");
  const labels=diseases.map(p=>p.label||p.disease||"");
  const items=[];
  if(names.some(n=>/血糖升高/.test(n))||labels.some(l=>/糖尿病/.test(l))) items.push("持续6个月以上血糖控制良好（空腹＜7.0，糖化＜7%）");
  if(names.some(n=>/高血压患者|血压病|原发性高血压/.test(n))||labels.some(l=>/高血压/.test(l))) items.push("持续6个月以上血压控制良好（收缩压＜140，舒张压＜90）");
  if((names.some(n=>/甲状腺结节|乳腺结节/.test(n)))&&labels.some(l=>/(4类|4级)/.test(l))) items.push("穿刺结果良性且术后满1年无复发");
  if(names.some(n=>/大三阳/.test(n))) items.push("肝功能持续正常6个月以上且病毒指标改善（如转为小三阳或DNA转阴）");
  if(labels.some(l=>/肥胖|超重/.test(l))) items.push("BMI降至正常范围并稳定维持6个月以上");
  if(!items.length) return "";
  if(full){
    return `📈 风险改善指引\n根据您目前的情况，当前结论主要基于现有健康状况。\n如果您后续能做到以下改善，核保员在重新评估时会参考这些信息：\n- ${items.join("\n- ")}\n\n重要说明：\n1. 药物控制后的指标改善，核保员会综合评估用药情况、控制稳定性及并发症风险，不代表可直接改变结论。\n2. 核保结论调整需基于长期（通常6-12个月以上）的稳定控制记录，短期指标改善不能作为核保放宽的依据。\n3. 单次检查结果改善不代表疾病风险已消除，保司会要求提供连续监测记录。\n4. 具体结论以实际投保时保险公司核保审核为准。\n建议您定期复查，保留完整病历资料，未来条件改善后可重新尝试投保。`;
  }
  return `📈 风险改善指引：若未来能实现以下改善，核保员重新评估时会参考：\n- ${items.join("\n- ")}\n（具体放宽以保司核保为准，需长期稳定记录。）`;
}
/* 信息不足 → 自然语言引导（需求八），替代技术性字段列表 */
function naturalMissing(perDisease){
  const need=[];
  const seen=new Set();
  const add=(s)=>{ s=String(s||"").trim(); if(!s||seen.has(s)) return; seen.add(s); need.push(s); };
  // 「并发症」「直径」两类话术需先判断疾病归属，避免跨病种串话术：
  //   · 糖尿病类才写"是否有糖尿病并发症"，其余疾病用中性"有无相关并发症"
  //   · 肌瘤/囊肿类把"结节具体多大"改为"病灶最大直径"，避免语义错位
  const SCOPE_DM    = /血糖升高|糖尿病/;   // 糖尿病类
  const SCOPE_LESION= /肌瘤|囊肿|腺肌/;    // 肌瘤/囊肿类（非结节）
  for(const p of perDisease){
    if(!p.missing||!p.missing.length) continue;
    // 归属判断文本：标准病名 + 用户原词 + 规则病名，三者任一命中即可
    const dn=[p.disease,p.label,p.rule&&p.rule.disease].filter(Boolean).join(" ");
    const isDM=SCOPE_DM.test(dn);
    const isLesion=SCOPE_LESION.test(dn);
    for(const q of p.missing){
      if(/直径|结节最大/.test(q)) add(isLesion?"病灶最大直径（cm）":"结节具体多大（最大直径）");
      else if(/分级/.test(q)) add("TI-RADS / BI-RADS 分级");
      else if(/影像|描述|边界|钙化/.test(q)) add("影像描述（边界是否清晰、有无钙化、纵横比等）");
      else if(/血压|收缩压|舒张压/.test(q)) add("血压具体数值（收缩压/舒张压）");
      else if(/并发症/.test(q)) add(isDM?"是否有糖尿病并发症":"有无相关并发症");
      else if(/手术/.test(q)) add("手术及病理情况");
      else if(/年龄/.test(q)) add("准确年龄");
      else {
        // 检查类字段归一化去重：甲状腺超声 / 甲状腺B超 → 同一检查项，只出现一次
        const c=canonicalCheckItem(q);
        add(c || q.replace(/[？?。.]/g,""));
      }
    }
  }
  return need;
}
/* 补充项去重 key：手术类单独成类（避免"手术及病理情况"被 /病理/ 误归为"病理/穿刺报告"），
   其余检查类用 canonicalCheckItem 归一化；非检查类用原文。 */
function supplementKey(s){
  s=String(s||"").trim();
  if(!s) return "";
  if(/手术/.test(s)) return "手术及病理情况";
  return canonicalCheckItem(s) || s;
}
/* 合并「缺失字段(信息) + 检查材料」，去重后返回统一清单（每项只出现一次） */
function mergeSupplementItems(perDisease, mats){
  const out=[]; const seen=new Set();
  const add=(s)=>{ s=String(s||"").trim(); if(!s) return; const key=supplementKey(s); if(!seen.has(key)){ seen.add(key); out.push(s); } };
  for(const s of naturalMissing(perDisease)) add(s);
  for(const m of (mats||[])) add(m);
  return out;
}

/* LIVER_DISEASES -> 已抽取至 data.js */

function isLiverDisease(d){
  if(!d) return false;
  if(LIVER_DISEASES.has(stripParen(d))) return true;
  const m=String(d).match(/[（(]([^）)]+)[）)]/);   // 括号内短名（如 甲型肝炎（甲肝）→甲肝）
  if(m){ for(const seg of m[1].split(/[、,，\n]/)){ if(LIVER_DISEASES.has(seg.trim())) return true; } }
  return false;
}

/* ================================================================
   展示层规范化（DISPLAY_OVERRIDE，独立模块）
   —— 把规则库中「非 ICD-10 正式诊断名 / 伪造 ICD 编码」的心电图类词条，
   在【展示层】统一规范为「心电图异常（ST-T改变）」+ ICD-10 正式编码 R94.31（异常心电图）。
   仅作用于 renderCard / analysisText / combinedAnalysisText / callDeepSeek 的展示文案，
   绝不影响 DISEASE_MAP / EXTRA_ALIAS 映射、RULES 匹配、结论（转人工/拒保…）。
   ================================================================ */
const DISPLAY_OVERRIDE = (function(){
  // 内部规则病名（含 label 变体）→ 规范展示名。
  // 说明：心电图非特异性 ST-T 改变（T波倒置/ST段压低/T波改变）与「心肌劳损」均非 ICD-10 正式诊断名，
  //       统一规范为「心电图异常（ST-T改变）」。
  const NAME_MAP = {
    "心肌劳损（心肌缺血）": "心电图异常（ST-T改变）",
    "心肌劳损": "心电图异常（ST-T改变）",
    "st段或T波异常": "心电图异常（ST-T改变）",
    "ST段或T波异常": "心电图异常（ST-T改变）",
    "ST-T改变": "心电图异常（ST-T改变）",
    "ST-T异常": "心电图异常（ST-T改变）"
  };
  // 伪造 / 非标准 ICD 编码 → ICD-10 正式编码
  const ICD_MAP = {
    "I51.502": "R94.31",   // 心肌劳损（心肌缺血）：I51.502 非 WHO ICD-10 正式编码 → 异常心电图 R94.31
    "R94.303": "R94.31"    // 心电图类（st段或T波异常 等）：R94.303 非标准 → R94.31
  };
  // 正文动态展示的「用户原始输入词」候选（含大小写变体）
  const ORIG_KEYS = ["T波倒置","ST段压低","T波改变","t波倒置","st段压低","ST段改变","ST-T改变","心肌缺血","心肌劳损"];
  function name(rawName){
    const k = String(rawName==null?"":rawName);
    if(NAME_MAP[k]) return NAME_MAP[k];
    const stripped = k.replace(/[（(].*?[)）]/g,"");
    return NAME_MAP[stripped] || k;
  }
  function icd(rawIcd){ return ICD_MAP[rawIcd] || rawIcd; }
  function origWord(text){
    const t = String(text==null?"":text);
    for(const k of ORIG_KEYS){ if(t.indexOf(k)>=0) return k; }
    return null;
  }
  function isEcg(rawName){
    const k = String(rawName==null?"":rawName);
    if(NAME_MAP[k]) return true;
    return NAME_MAP[k.replace(/[（(].*?[)）]/g,"")] != null;
  }
  return { name, icd, origWord, isEcg };
})();

/* ============== 文案生成 ============== */
function analysisText(rule, info){
  const c=rule.conclusions; const parts=[];
  const intent=info.intent||"重疾险";
  const main=c[intent]||c["重疾险"]||Object.values(c)[0];
  const rawDisease=rule.disease;
  const isEcg=DISPLAY_OVERRIDE.isEcg(rawDisease);
  const orig=(info&&info.origEcgWord)||null;
  let base;
  if(isEcg){
    // 心电图异常类：正文动态带出用户原始输入词（如 T波倒置 / ST段压低），并提示为非特异性 ST-T 改变
    const w = orig ? `（${orig}）` : "";
    base=`针对您提到的心电图异常${w}，系统识别为非特异性ST-T改变，按行业通用核保规则，`;
  }else{
    const dn=DISPLAY_OVERRIDE.name(rawDisease.replace(/[（(].*?[)）]/g,""));
    base=`针对您提到的「${dn}」，按行业通用核保规则，`;
  }
  const map={
    "通过":`该疾病在核保评估中通常可按标准体（标体）承保，结论为「通过」。建议您在投保时如实告知病史并提供历次复查资料。`,
    "标体":`该疾病在核保评估中通常可按标准体承保，结论为「通过/标体」。`,
    "除外":`该疾病相关责任可能被「除外承保」，即保险公司承担其他责任，但与该疾病直接相关的后续治疗不在保障范围内。`,
    "转人工":`该情形需转人工核保进一步评估，核保员将结合完整病历、检查报告综合判断，最终结论以人工审核为准。`,
    "延期":`当前情况暂不支持承保，需观察或治疗后重新评估（延期）。建议补充完整诊疗资料后再行投保。`,
    "拒保":`基于现有信息，该情形在通用核保规则下通常结论为「拒保」。如有异议或后续病情改善，可携完整资料申请人工复核。`
  };
  base += (map[main]||`结论为「${dispConclusion(main)}」，具体以保险公司实际核保为准。`);
  return base + " 本结论为通用规则初步参考，不代表任何保险公司的正式核保决定。";
}
/* 多疾病合并分析文案（默认话术，DeepSeek 不可用时使用） */
function combinedAnalysisText(perDisease, info){
  const parts=perDisease.filter(p=>p.rule).map(p=>{
    const dn=DISPLAY_OVERRIDE.name(p.label||p.disease);
    const dc=diseaseConclusion(p.rule);
    const v=dc.manual?"转人工":(dc.strictest||"标体");
    return `「${dn}」评估为${v}`;
  });
  const manualNames=perDisease.filter(p=>p.rule).map(p=>{
    const dn=DISPLAY_OVERRIDE.name(p.label||p.disease);
    const dc=diseaseConclusion(p.rule);
    return dc.manual?(p.label||p.disease):null;
  }).filter(Boolean).map(dn=>DISPLAY_OVERRIDE.name(dn));
  /* 严格度裁决：拒保(5) > 转人工(3.5)——整单已有拒保时，分析话术按终局"暂时无法通过"说，不再以转人工口径削弱 */
  const _risk={"拒保":5,"延期":4,"转人工":3.5,"加费":3,"除外":2,"标体":1,"通过":1};
  let _strict="标体";
  for(const p of perDisease.filter(p=>p.rule)){
    const dc=diseaseConclusion(p.rule);
    const v=dc.manual?"转人工":(dc.strictest||"标体");
    if((_risk[v]||0)>(_risk[_strict]||0)) _strict=v;
  }
  if(_strict==="拒保"){
    return `综合评估结论为拒保，本次投保暂时无法通过。各项疾病评估见上；投保时请如实告知全部病史，如对结论有异议，可申请人工核保复核。本结论为通用规则初步参考，不代表任何保险公司的正式核保决定。`;
  }
  if(_strict==="延期"){
    return `综合评估结论为延期，本次投保暂时无法立即投保；满足延期条件（如术后满一定期限、复查稳定）后可重新申请。各项疾病评估见上；投保时请如实告知全部病史。本结论为通用规则初步参考，不代表任何保险公司的正式核保决定。`;
  }
  if(manualNames.length){
    return `因「${manualNames.join("」「")}」需人工核保，本单需整体转人工核保，由核保员结合完整病历与检查资料给出最终结论。本结论为通用规则初步参考，不代表任何保险公司的正式核保决定。`;
  }
  return `各项疾病已分别评估如上（见各疾病评估）。多个健康异常叠加时，核保评估通常更为谨慎，最终结论以保险公司综合评估为准。本结论为通用规则初步参考，不代表任何保险公司的正式核保决定。`;
}
/* 检查项目名称规范化（用于补充材料去重）：
   甲状腺超声 / 甲状腺B超 / 甲状腺彩超 → 甲状腺B超；心电图 / 动态心电图 → 心电图；心脏超声 / 心超 → 心脏彩超 … */
function canonicalCheckItem(s){
  s = String(s==null?"":s);
  if(/甲状腺超声|甲状腺B超|甲状腺彩超|甲状腺及颈部淋巴结/.test(s)) return "甲状腺B超报告";
  if(/甲状腺功能|甲功|FT3|FT4|TSH|游离甲状腺素/.test(s)) return "甲状腺功能检查";
  if(/动态心电图|24小时.*心电图|心电图/.test(s)) return "心电图";
  if(/心脏彩超|心脏超声|心超|超声心动/.test(s)) return "心脏彩超";
  if(/乳腺超声|乳腺B超|乳腺彩超/.test(s)) return "乳腺B超报告";
  if(/乳腺钼钯|钼靶/.test(s)) return "乳腺钼靶";
  if(/腹部超声|腹部B超|肝胆.*B超/.test(s)) return "腹部B超";
  if(/妇科B超|妇科超声|子宫.*附件.*B超/.test(s)) return "妇科B超";
  if(/HPV|TCT|宫颈刮片|液基细胞|人乳头瘤/.test(s)) return "TCT及HPV检查";
  if(/胸部CT|胸CT|肺CT|胸部影像/.test(s)) return "胸部CT";
  if(/胸片|X光/.test(s)) return "胸片";
  if(/病理|穿刺|活检/.test(s)) return "病理/穿刺报告";
  if(/乙肝两对半|乙肝五项|HBsAg|HBsAb|HBeAg|HBeAb|HBcAb/.test(s)) return "乙肝两对半（乙肝五项）";
  if(/乙肝DNA|HBV.?DNA|病毒载量/.test(s)) return "乙肝DNA（病毒载量）";
  if(/AFP|甲胎蛋白/.test(s)) return "AFP（甲胎蛋白）";
  if(/肝功能|转氨酶|ALT|AST|肝功/.test(s)) return "肝功能检查（ALT/AST）";
  if(/肾功能|肌酐|尿素氮|尿常规/.test(s)) return "肾功能/尿常规";
  if(/血常规/.test(s)) return "血常规";
  if(/糖化血红蛋白|HbA1c/.test(s)) return "糖化血红蛋白（HbA1c）";
  if(/血糖/.test(s)) return "血糖数值";
  if(/血脂|胆固醇|甘油三酯/.test(s)) return "血脂检查";
  if(/肿瘤标志物|CEA|CA-?\d+/.test(s)) return "肿瘤标志物";
  if(/手术.*记录|术后/.test(s)) return "手术记录及术后病理";
  return null;
}
/* 补充材料去重：同一检查项目只保留一条（规则引擎多字段 → 同一检查项只出现一次） */
function dedupeCheckItems(list){
  const seen=new Set(); const out=[];
  for(const item of (list||[])){
    const key = canonicalCheckItem(item) || item;
    if(seen.has(key)) continue;
    seen.add(key); out.push(item);
  }
  return out;
}
/* 从匹配规则的【条件字段 + 缺失字段】提取该疾病需补充的检查材料，去重后返回（每项一次） */
function collectMaterials(perDisease){
  const set=new Set(); const out=[];
  const push=(s)=>{ const c=canonicalCheckItem(s); if(c && !set.has(c)){ set.add(c); out.push(c); } };
  for(const p of perDisease){
    if(!p.rule) continue;
    for(const q of (p.missing||[])) push(q);
    for(const cond of (p.rule.conditions||[])) push(cond.q||"");
  }
  return out;
}

/* ================================================================
   补充信息新架构 v2（批次1 白名单试点，2026-09-15）

   回滚：SUPPLEMENT_ROLLOUT.enabled = false。
   ================================================================ */
const SUPPLEMENT_ROLLOUT = {
  enabled: true,
  batch: 1,
  // ⚠️ 必须是「规范病名」（已过 findDiseaseSpans 核验），用户输入词会永不命中
  // 批次1补充 v2：三结节 + 结石类分系统共用。

const MATERIAL_PIPE = (function(){
  const TAX = [

    {cat:'lab', std:'血压数值', re:/血压|收缩压|舒张压|mmHg/},
    {cat:'lab', std:'眼底检查', re:/眼底/},
    {cat:'imaging', std:'心电图', re:/心电图/},
    {cat:'imaging', std:'心脏彩超', re:/心脏彩超|超声心动|心超/},
    {cat:'imaging', std:'胸部CT', re:/胸部CT|胸CT|肺CT|胸片/},
    {cat:'imaging', std:'甲状腺B超报告', re:/甲状腺[^，。？]*?(?:B超|超声|彩超)/},
    {cat:'imaging', std:'乳腺B超报告', re:/乳腺[^，。？]*?(?:B超|超声|彩超)/},
    {cat:'imaging', std:'妇科B超', re:/妇科[^，。？]*?(?:B超|超声)|子宫附件[^，。？]*?B超|盆腔[^，。？]*?B超/},
    {cat:'imaging', std:'腹部B超', re:/腹部[^，。？]*?(?:B超|超声|彩超)|肝胆[^，。？]*?B超|肝脏[^，。？]*?B超|肾脏B超|泌尿系B超/},
    {cat:'imaging', std:'影像检查报告', re:/(?<![A-Za-z])(?:CT|MRI|核磁)(?![A-Za-z])|超声|彩超|B超|影像检查/},
    {cat:'patho', std:'病理或穿刺报告', re:/病理|活检|穿刺/},
    {cat:'tx', std:'手术/介入记录及术后情况', re:/手术|切除|术后|碎石|介入|支架|搭桥|消融|封堵|修补|移植/},
    {cat:'tx', std:'目前用药情况', re:/服药|用药|药物|药名|剂量|胰岛素|降糖药|降压药|降脂药/},
    {cat:'func', std:'心功能分级（NYHA）', re:/心功能|NYHA/},
    {cat:'base', std:'准确年龄及确诊时间', re:/年龄|周岁|确诊[^，。？]*时间|发现[^，。？]*时间/},
    {cat:'base', std:'有无相关并发症或后遗症', re:/并发症|后遗症/}
  ];
  function canon(s){ let best=null,bl=-1; for(const t of TAX){ const m=s.match(t.re); if(m&&m[0].length>bl){best=t;bl=m[0].length;} } return best; }
  function normDur(num, unit){
    if(num==='半') return {n:'6', u:'个月'};
    if(num==='一') return {n:'1', u:(unit==='周岁'?'周岁':unit)};
    const map={年:'年',月:'个月',周:'周',天:'天',日:'天'};
    return {n:num, u:(unit==='周岁'?'周岁':(map[unit]||unit))};
  }
  const ACT_NEG = /未经|未做|未行|未予|尚未|不存在|非继发|除外|无需/;
  // 引导词清单（长词在前，短词在后）
  const LEAD = /(是否存在以下任一情况之一|是否存在以下情况之一|是否有下述任何情形之一|是否有下述情形之一|是否存在以下任一情况|是否存在以下情况|有无下述任何情形之一|有无下述情形之一|下述任何情形之一|下述情形之一|以下任一情况|以下情况|下列情况|是否存在|是否伴有|是否合并|目前是否|是否已|是否有|是否|有无)[：:]*/g;
  function isEnum(s){
    if((s.match(/、/g)||[]).length>=2) return true;
    if(/之一|以下情况|以下任一|下列|情形/.test(s)) return true;
    if(/（\d）/.test(s)) return true;
    if((s.match(/或/g)||[]).length>=2) return true;
    return false;
  }
  function summarize(s){
    let t = s.replace(/[？?。]+$/,'').trim().replace(/\n/g,'');
    t = t.replace(/^是否为/, '');                            // 句首"是否为"是引导词，照删
    t = t.replace(/是否为/g, '\u0001');                       // 句中"是否为"是判定型结构，保护（删了变断言）
    t = t.replace(LEAD, '');                                 // 引导词全局替换（含句中残留）
    t = t.replace(/\u0001/g, '是否为');
    t = t.replace(/^[：:]\s*/,'')
         .replace(/[（(]\d[)）]/g,'、')       // （1）（2）编号 → 顿号
         .replace(/[；;]/g,'、')              // 分号统一转顿号：分项列举的「；」不得当句子分隔符
         .replace(/、{2,}/g,'、').replace(/^、|、$/g,'').replace(/^[：:、\s]+/,'').replace(/[，,]+$/,'').trim();
    if(t.length>38) t=t.slice(0,38)+'…';
    return t;
  }
  // 枚举末尾加"等"：被截断的枚举把"…"回退到词边界后改"等"，并补未闭合的右括号
  function enumDeng(g){
    const wasClipped = /…$/.test(g);
    let t = g.replace(/…$/,'');
    if(/等[）)]*$/.test(t)) return t;
    if(wasClipped){
      const i = Math.max(t.lastIndexOf('、'), t.lastIndexOf('，'), t.lastIndexOf(','));
      if(i>=0){
        const tail = t.slice(i+1);
        if(!/[）)0-9]$/.test(tail)) t = t.slice(0, i);        // 尾部是半截词则回退到词边界
      }
      t = t.replace(/[、,，]+$/,'').replace(/[（(]+$/,'');
      t += '等';
      const open = (t.match(/[（(]/g)||[]).length;
      const close = (t.match(/[）)]/g)||[]).length;
      if(open > close) t += '）'.repeat(open - close);
      return t;
    }
    t = t.replace(/[、,，]+$/,'');
    if(/[、,，]/.test(t)) t += '等';                            // 未截断：仅真列举才加"等"，单条分项不加
    return t;
  }
  function one(p){
    const c = canon(p);
    if(c && /[<＜>＞≥≤]/.test(p)){
      const b = p.match(/[（(]([^（）()]*[<＜>＞≥≤]\s*\d[^（）()]*)[)）]/);
      if(b){ let rng=b[1].replace(/，|,/g,'、').trim(); return {text:c.std+'（'+rng+'）', note:'术语+范围'}; }
    }
    let m = p.match(/(.{1,14}?)(?:已经|已|大于|超过|>|＞|满)\s*(半|一|\d+(?:\.\d+)?)\s*(周岁|年|个月|月|周|天|日)/);
    if(m){
      let subj = m[1].replace(/^(是否|有无|目前|现在|已经|已)+/,'').replace(/[，,、。；\s]+$/,'').replace(/(已经|已)$/,'').trim() || '该情况';
      const d = normDur(m[2], m[3]);
      return {text: subj+'是否满 '+d.n+d.u, note:'时长'};
    }
    m = p.match(/(.{1,16}?)(?:[<＜>＞≥≤]\s*)(\d+(?:\.\d+)?)/);
    if(m){
      let subj = m[1].replace(/^(是否|有无|且|或|水平|为)+/,'').replace(/[（(,，、。]+$/,'').trim();
      return {text:'最近一次 '+(subj||'相关指标')+' 数值', note:'数值'};
    }
    if(c) return {text:c.std, note:'术语:'+c.cat};
    let t = p.replace(/^是否为/,'').replace(/是否为/g,'\u0001').replace(LEAD,'').replace(/\u0001/g,'是否为').replace(/[？?]+$/,'').trim();
    if(t.length>=2 && t.length<=30) return {text:t, note:'陈述'};
    return null;
  }
  function handleSegment(p){
    const r=[];
    if(isEnum(p)){ const g=summarize(p); if(g) r.push({text:enumDeng(g),note:'概括'}); return r; }
    if(ACT_NEG.test(p)){ const g=summarize(p); if(g) r.push({text:g,note:'概括(否定)'}); return r; }
    const o0 = one(p);
    if(o0 && o0.note==='术语+范围'){ r.push(o0); return r; }
    const parts = p.split(/，|,|、/).map(x=>x.trim()).filter(Boolean);
    if(parts.length>1){
      for(const x of parts){
        const o=one(x)||(summarize(x)?{text:summarize(x),note:'概括'}:null);
        // 极短碎片不产出：「是否经…检查、治疗，…」这种会被切出「治疗」这类无信息项
        if(o && !(o.note==='陈述' && o.text.length<=2)) r.push(o);
      }
    } else {
      if(o0) r.push(o0); else { const g=summarize(p); if(g) r.push({text:g,note:'概括'}); }
    }
    return r;
  }
  function toMaterials(qs){
    const items=[];
    for(const q of (qs||[])){
      const src=String(q||'');
      // 含 ≥2 个（数字）的是分项列举（（1）…；（2）…），整句概括，禁止按「；」切碎
      const numbered = (src.match(/（\s*\d\s*）/g)||[]).length >= 2;
      const sents = numbered ? [src] : src.split(/[？?。；]/).map(x=>x.trim()).filter(Boolean);
      for(let s of sents){
        const segs = s.split(/且|并且|同时/).map(x=>x.trim()).filter(Boolean);
        for(const seg of segs){
          for(const x of handleSegment(seg)){
            if(x && x.text && !items.some(i=>i.text===x.text)) items.push(x);
          }
        }
      }
    }
    return items;
  }
  return { toMaterials, canon };
})();

// L4 通用基础项（与 SUPPLEMENT_KB 内部 COMMON 文案完全一致，保证同病去重生效）

/* 【拒保说明块】三列（医疗险/重疾险/增额寿）结论全为「拒保」的病名集合。
   用途：命中此类病时，在「建议补充的信息」上方显示「核保结论说明」块（告知结论 + 人工复核出口），
   并保留原补充信息清单（供人工复核/转投参考）。运行时从 RULES 聚合计算，不手工维护名单。 */
const REJECT_ALL = (function(){
  const s=new Set();
  try{
    const agg=new Map();
    (typeof RULES!=='undefined'?(RULES||[]):[]).forEach(function(r){
      if(!r||!r.disease) return;
      if(!agg.has(r.disease)) agg.set(r.disease,[]);
      agg.get(r.disease).push(r);
    });
    agg.forEach(function(list,d){
      if(!list.length) return;
      const all=list.every(function(r){
        const c=r.conclusions||{};
        return c['医疗险']==='拒保' && c['重疾险']==='拒保' && c['增额寿']==='拒保';
      });
      if(all) s.add(d);
    });
  }catch(e){ /* RULES 未就绪时退化为空集，不影响主流程 */ }
  return s;
})();
// 拒保说明块开关：置 false 一键关闭说明块（不影响清单），用于细粒度回退
const REJECT_NOTE_ENABLED = true;
// 拒保病展示名：优先用户短名(label)；超长病名（去括号后仍 >16 字）截取首段 + 等，避免把整条规则名甩进说明块
function _rejectDisplayName(s){
  const n = DISPLAY_OVERRIDE.name(s);
  if(n.length<=16) return n;
  const seg = n.replace(/[（(].*?[)）]/g,'').split(/[、,，]/)[0];
  return (seg && seg.length<n.length) ? seg+'等' : n.slice(0,16)+'…';
}

/* 统一编排 L1→L5，返回 [{text, src, disease}]（带来源标注，供对照测试读取） */
function buildSupplementItems(perDisease){
  const ruled=(perDisease||[]).filter(p=>p.rule);
  const items=[]; const seen={};
  function push(d, src, arr){
    if(!arr||!arr.length) return;
    if(!seen[d]) seen[d]=new Set();
    for(const raw of arr){
      const t=String(typeof raw==='string'?raw:((raw&&raw.text)||'')).trim();
      if(!t || seen[d].has(t)) continue;
      seen[d].add(t);
      items.push({text:t, src:src, disease:d});
    }
  }
  for(const p of ruled){
    const d=p.disease||(p.rule&&p.rule.disease)||'';
    // L1 定制清单（含由旧路径硬编码迁移来的甲状腺结节项、结节动态模板）
    let l1=[];
    for(const ds of DISEASE_SUPPLEMENT){ if(ds.re.test(d)) l1=l1.concat(supplementItemsOf(ds,d)); }
    // L1 独占：命中定制清单即代表该病已有人工审定清单，不再叠加 L2/L3/L4
    //   （否则胆结石会重新被 KB 消化类的胃镜/肠镜/HP 污染，肾结石会出现跨层重复文案）
    if(l1.length){ push(d,'L1定制清单',l1); continue; }
    // L2 规则原句清洗（conditions.q + missing）—— 仅 l2Diseases 内的病启用
    if(SUPPLEMENT_ROLLOUT.l2Diseases.has(d)){
      const qs=[];
      ((p.rule&&p.rule.conditions)||[]).forEach(c=>{ if(c&&c.q) qs.push(c.q); });
      (p.missing||[]).forEach(q=>{ if(q) qs.push(q); });
      push(d,'L2规则清洗',MATERIAL_PIPE.toMaterials(qs));
    }
    // L3 KB（走原 getSupplementItems；批次1 五病不受排除名单影响，已核实）
    push(d,'L3 KB',SUPPLEMENT_KB.getSupplementItems(d));
    // L4 通用
    push(d,'L4通用',COMMON_MATERIALS);
  }
  // 跨疾病归并：同文案只保留最先生产出的一条
  const out=[]; const cs=new Set();
  for(const it of items){ if(cs.has(it.text)) continue; cs.add(it.text); out.push(it); }
  // L5 兜底：仅当不足 3 项时才由 naturalMissing 补
  if(out.length<3){
    const nm=naturalMissing(perDisease)||[];
    for(const t of nm){ const x=String(t||'').trim(); if(x&&!cs.has(x)){ cs.add(x); out.push({text:x,src:'L5兜底',disease:'(兜底)'}); } }
  }
  return out;
}

const _useMaterialMap = true;   // 新表查表总开关：true=走 material.js 查表；false=退回旧五层/旧路径
const _useLayeredRender = true; // 三段式渲染总开关（20261020 S3）：true=按 report/conditional/ask 三段展示；false=回退旧按病分组渲染
/* 病内语义槽位去重：同一病内，按「用药/随访/病理/手术」四槽位去重，保留信息量最大的一条。
   归属按「最早出现的关键词位置」判断（如"手术及病理情况"归手术槽位而非病理）。
   未命中槽位的项仅按文字去重，保留原顺序。跨病不去重（由调用方按病分组各自独立调用）。 */
function dedupeBySlot(items){
  const SLOTS=[
    { re:/用药|服药|药名|剂量/ },
    { re:/随访|复查/ },
    { re:/病理|活检|穿刺/ },
    { re:/手术|住院|出院/ }
  ];
  function slotIdx(s){
    let best=-1, bestPos=Infinity;
    for(let i=0;i<SLOTS.length;i++){
      const m=s.match(SLOTS[i].re);
      if(m && m.index<bestPos){ best=i; bestPos=m.index; }
    }
    return best;
  }
  function score(s){
    let sc=s.length;
    if(/如|等|具体|历次|对比|药名|示例/.test(s)) sc+=100;   // 带示例/具体措辞的信息量更大
    return sc;
  }
  const slotBest=[];         // slotIdx -> 当前保留的文本
  const out=[];
  const plainSeen=new Set();
  for(const it of items){
    const s=String(it==null?"":it).trim();
    if(!s) continue;
    const si=slotIdx(s);
    if(si>=0){
      if(slotBest[si]===undefined){
        slotBest[si]=s; out.push(s);
      }else if(score(s)>score(slotBest[si])){
        const idx=out.indexOf(slotBest[si]);
        if(idx>=0) out[idx]=s;
        slotBest[si]=s;
      }
    }else{
      if(!plainSeen.has(s)){ plainSeen.add(s); out.push(s); }
    }
  }
  return out;
}
function materialItemsOf(ruledP){
  const rejectNames=[]; const guideNames=[]; const groups=[];
  const M = (typeof MATERIAL!=='undefined') ? MATERIAL : null;
  if(!M){ return { globalItems: [], groups, rejectNames, guideNames }; }
  // 预建索引（每病 O(1) 查表）
  const dmIdx={}; for(const e of M.diseaseMap) dmIdx[e.disease]=e;
  const tByName={}; for(const t of M.types) tByName[t.name]=t;
  const sByName={}; for(const s of M.specialCases) sByName[s.disease]=s;
  for(const p of (ruledP||[])){
    let d=p.disease || (p.rule&&p.rule.disease) || '';
    let e=dmIdx[d];
    if(!e && p.label){ e=dmIdx[p.label]; if(e) d=p.label; }   // 长名占位规则兜底：如"良性肿瘤"规则 disease 为超长名，label 为短名；转人工病也需材料区（人工核保的输入）
    if(!e) continue;                       // 仍无匹配（真正未入表）：不产材料
    // ① 指引确诊：独立路径，不给材料清单（渲染层据 guideNames 给"建议先明确诊断"提示）
    if(e.type==='指引确诊'){ guideNames.push(d); continue; }
    const disp=p.label||d;
    // ② 特例（先心4个）：独苗清单
    if(e.type==='specialCase'){
      const sp=sByName[d];
      groups.push({ disease:d, displayName:disp, isReject:false, items: dedupeBySlot(sp?sp.items:[]) });
      continue;
    }
    // ③ fallback（真无类型）：仅通用 4 条，无专项
    if(e.type==='fallback'){
      if(e.isRejectAll) rejectNames.push(d);
      groups.push({ disease:d, displayName:disp, isReject:!!e.isRejectAll, items:[] });
      continue;
    }
    // ④ 真实类型模板（含拒保病复用模板）
    const tpl=tByName[e.type];
    if(!tpl){ if(e.isRejectAll) rejectNames.push(d); continue; }
    const raw=[];
    for(const it of tpl.items){
      let s=it;
      if(e.type==='慢病型' && it==='化验或检查报告（含核心指标数值及测量记录）' && e.metrics) s=e.metrics;
      if(e.imagingItem && /^(影像|妇科B超|专科检查)/.test(it)) s=e.imagingItem;
      else if(e.type==='结节型' && it==='影像报告（含分级）') s=e.imagingItem || '相关影像或专科检查报告（含影像描述及历次复查对比）';
      raw.push(s);
    }
    if(e.type==='占位型' && e.organ) raw.push(e.organ);
    if(e.extraItems) for(const x of e.extraItems) raw.push(x);
    if(e.excludeItems && e.excludeItems.length) for(let i=raw.length-1;i>=0;i--) if(e.excludeItems.includes(raw[i])) raw.splice(i,1);
    if(e.isRejectAll) rejectNames.push(d);
    groups.push({ disease:d, displayName:disp, isReject:!!e.isRejectAll, items: dedupeBySlot(raw) });
  }
  return { globalItems: M.globalItems.slice(), groups, rejectNames, guideNames };
}

/* ===== 批次B：跨病材料合并展示（纯渲染层，不改 material.js / materialItemsOf 输出） =====
   R1a 全病共有条目（trim后逐字节相等）→ 合并一条，不加尾缀（组标题统一注明"请分别提供"）
   R1a' 部分病共有（>=2病且非全病）→ 合并一条 + （X/Y分别提供）尾缀；>3器官 → （各部位分别提供）
   R1b 单病独有条目 → 保留 + （器官）尾缀；文本已含该器官词则不重复加
   R3 顺序稳定：公共条按首次出现序在前，部分共有次之，单病独有条按病序在后
   R4 病内去重先行：入参 items 已经过 dedupeBySlot，本函数不做病内去重 */
function mergeGroupsForDisplay(groups){
  try{
    if(!Array.isArray(groups) || groups.length<2) return null;
    function organOf(d){
      const s=String(d==null?"":d).trim();
      const st=s.replace(/(结节|息肉|结石|囊肿|炎|瘤)$/,"");
      return st||s;
    }
    const organs=[]; let hasReject=false;
    for(const g of groups){
      hasReject=hasReject||!!g.isReject;
      const o=organOf(g.disease);
      if(o && organs.indexOf(o)<0) organs.push(o);
    }
    const total=groups.length;
    const counter={}; const textOrgans={};
    for(const g of groups){
      const o=organOf(g.disease);
      for(const it of (g.items||[])){
        const s=String(it==null?"":it).trim(); if(!s) continue;
        counter[s]=(counter[s]||0)+1;
        if(!textOrgans[s]) textOrgans[s]=[];
        if(textOrgans[s].indexOf(o)<0) textOrgans[s].push(o);
      }
    }
    const common=[], partial=[], diff=[];
    const seenC={}, seenP={}, seenD={};
    for(const g of groups){
      for(const it of (g.items||[])){
        const s=String(it==null?"":it).trim(); if(!s) continue;
        const c=counter[s]||0;
        if(c===total){
          if(!seenC[s]){ seenC[s]=1; common.push(s); }
        }else if(c>=2){
          if(!seenP[s]){
            seenP[s]=1;
            const os=textOrgans[s]||[];
            const tag = os.length>3 ? "（各部位分别提供）" : "（"+os.join("/")+"分别提供）";
            partial.push(s+tag);
          }
        }else{
          if(seenD[s]) continue; seenD[s]=1;
          const o=organOf(g.disease);
          diff.push(s.indexOf(o)>=0 ? s : s+"（"+o+"）");
        }
      }
    }
    return { common, partial, diff, organs, hasReject };
  }catch(e){ return null; }
}

/* ============== DeepSeek API（统一调用：同域代理 → 直连 → 兜底） ============== */
/* 安全说明：客户端不内置密钥。部署到 Vercel 时由 api/deepseek.js 代理（密钥存环境变量）；
   本地测试可运行 proxy.py 启动同源代理。直接 file:// 打开时 DeepSeek 不可用，自动走默认话术。 */
const DEEPSEEK_KEY = "";                 // 留空：密钥仅在服务端代理中配置
const DEEPSEEK_MODEL = "deepseek-chat";
const DEEPSEEK_API = "https://api.deepseek.com/v1/chat/completions";

async function callDeepSeekAPI(messages, opts={}){
  const model=opts.model||DEEPSEEK_MODEL, temperature=opts.temperature??0.6, max_tokens=opts.max_tokens??800;
  // 20261021 批次A：deepseek-flash 为混合推理模型，推理 token 计入 max_tokens（实测占 60-95%），
  // 会导致正文被截断（症状卡丢【免责声明】段、核保话术半句断）。默认关闭推理，只取正文输出。
  const payload={model, messages, temperature, max_tokens, thinking:opts.thinking||{type:"disabled"}};
  // 1) 同域代理（Vercel /api/deepseek 或本地 proxy.py 提供的同源接口）
  try{
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(), 6000);
    const r=await fetch("/api/deepseek",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),signal:ctrl.signal});
    clearTimeout(to);
    if(r.ok){ const d=await r.json(); const t=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content; if(t&&t.trim()) return t.trim(); }
  }catch(e){ /* 代理不可用，转直连 */ }
  // 2) 直连（仅当客户端配置密钥且 API 允许跨域；file:// 下通常会被 CORS 拦截）
  if(DEEPSEEK_KEY){
    try{
      const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(), 8000);
      const r=await fetch(DEEPSEEK_API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+DEEPSEEK_KEY},body:JSON.stringify(payload),signal:ctrl.signal});
      clearTimeout(to);
      if(r.ok){ const d=await r.json(); const t=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content; if(t&&t.trim()) return t.trim(); }
    }catch(e){ /* CORS/网络失败 */ }
  }
  return null;  // 调用失败 → 由调用方使用默认话术/本地提取
}

/* 步骤一：DeepSeek 提取结构化信息（疾病名 / 年龄 / 险种 / 指标 / 财务） */
async function callDeepSeekExtract(text){
  const sys="你是保险核保信息提取助手。请从用户描述中提取核保所需结构化信息，仅输出一个 JSON 对象（不要任何解释、不要 markdown 代码块）。字段：disease(标准疾病名字符串), age(数字或 null), gender('男'/'女'/null), intent('医疗险'/'重疾险'/'增额寿'/null), indicators(对象，可含 收缩压/舒张压/结节最大直径/分级/手术史/恶性 等键，值为字符串), riskAmount(风险保额，单位万元，数字或null), annualIncome(年收入，万元，数字或null), annualPremium(年交保费，万元，数字或null)。疾病名尽量使用标准医学名词。";
  const user="用户描述："+text;
  const txt=await callDeepSeekAPI([{role:"system",content:sys},{role:"user",content:user}],{temperature:0.2,max_tokens:800});
  if(!txt) return null;
  try{
    const m=txt.match(/\{[\s\S]*\}/); if(!m) return null;
    const o=JSON.parse(m[0]);
    return {
      age:o.age??null, gender:o.gender??null, disease:o.disease||null, intent:o.intent||null,
      indicators:o.indicators||{},
      riskAmount:o.riskAmount!=null?o.riskAmount*10000:null,
      annualIncome:o.annualIncome!=null?o.annualIncome*10000:null,
      annualPremium:o.annualPremium!=null?o.annualPremium*10000:null
    };
  }catch(e){ return null; }
}

/* 步骤三：DeepSeek 生成核保分析话术（失败则保留默认话术） */
async function callDeepSeek(perDisease, info, analysisEl){
  if(!perDisease||!perDisease.length||!analysisEl) return;
  const lines=perDisease.filter(p=>p.rule).map(p=>{
    const dn=DISPLAY_OVERRIDE.name(p.label||p.disease);
    const c=p.rule.conclusions;
    return `${dn}：医疗险${c["医疗险"]?dispConclusion(c["医疗险"]):"—"}、重疾险${c["重疾险"]?dispConclusion(c["重疾险"]):"—"}、增额寿${c["增额寿"]?dispConclusion(c["增额寿"]):"—"}`;
  });
  if(!lines.length) return;
  const sys="你是资深保险核保专家。请用专业但通俗易懂的语言（称呼用户为'您'），基于给出的多疾病及投保险种初步结论，写一段核保分析：先一句话点明综合结论（按最严档口径：拒保>延期>转人工>加费>除外>标体；含拒保时开头直接说明本次投保暂时无法通过；最严为延期时说明暂时无法立即投保、满足条件后可重新申请），再说明核保关注点，最后给一句投保建议。各险种初步结论已给定，分析必须与之一致，不得给出比初步结论更宽松的建议，不得暗示其他结论。不超过220字。文末说明：以上为初步参考，非最终承保决定。";
  const user=`被保人：${info.age?info.age+"岁":""}${info.gender?","+info.gender:""}\n投保险种意向：${info.intent||"重疾险"}\n各疾病初步结论：\n${lines.join("\n")}`;
  const txt=await callDeepSeekAPI([{role:"system",content:sys},{role:"user",content:user}],{temperature:0.6,max_tokens:700});
  if(txt){ analysisEl.textContent=txt+"\n\n（以上由 AI 辅助生成，仅供参考，最终以保险公司正式核保为准）"; }
  else if(analysisEl){ console.warn("[核保小助手] AI 增强分析未接通，已使用内置话术兜底（用户无感知）"); }
}

/* 从 AI 抽取结果里挑出「明确是病名、但规则库不认识」的部分。
   负向过滤：症状词 / 否定语境 / 过短 / 影像描述类，宁可漏也不要误报。 */
function dedupeUnresolved(names){
  const out = []; const seen = new Set();
  for(const raw of (names||[])){
    const n = String(raw==null?"":raw).trim();
    if(!n || n.length<3 || seen.has(n)) continue;
    if(/^(无|未|否认|未见|不详|没有|排除)/.test(n)) continue;
    if(/^(血压|血糖|血脂|心率|体温|身高|体重)/.test(n)) continue;
    if(detectSymptoms(n).length) continue;          // 症状 ≠ 疾病
    if(isKnownDiseaseName(n)) continue;
    seen.add(n); out.push(n);
    if(out.length>=6) break;
  }
  return out;
}

/* 规则未匹配时的兜底：优先用 DeepSeek 基于医学常识给出「症状参考分析」，
   绝不返回"未找到匹配规则"这类冷冰冰的话；AI 不可用时给柔和提示。 */
/* ===== 兜底逻辑（唯一）：任何路径无法匹配规则时统一走这里 =====
   在线：DeepSeek 4 段式医学常识分析（初步分析/核保参考/建议行动/免责声明）。
   离线（网络/CORS 失败）：温和本地兜底参考，同样带【去重后】的建议补充材料，绝不出现"未匹配"。 */
async function renderFallbackAnalysis(text, info, opts={}){
  // 精神心理类关键词拦截：命中即用专用文案，不走通用 DeepSeek 模板（避免把失眠/焦虑/抑郁当成普通症状去分析）
  if(detectPsycho(text).length){ renderPsychoCard(info); return; }
  const user=(opts.context&&opts.context.trim()) ? ("用户此前描述："+opts.context+"\n本次补充："+text) : ("用户描述的症状/情况："+text);
  const sys="你是一位资深的核保医学顾问。用户描述了他的症状或健康状况，但在我们的通用核保规则库中没有找到完全匹配的疾病。请基于您的医学常识，为用户提供以下分析（请使用【】小标题组织，4 段都要有）：\n1. 【初步分析】该症状或情况可能关联哪些疾病方向？（2-3个）\n2. 【核保参考】这些疾病在医疗险、重疾险中通常的核保倾向（标体/除外/延期/拒保）是什么？\n3. 【建议行动】建议用户做什么检查，或建议去哪个科室明确诊断？\n4. 【免责声明】以上仅为基于医学常识的参考分析，不构成正式核保结论。最终以医生诊断和保险公司核保结论为准。\n注意：不要使用“未找到匹配规则”等冷冰冰的技术表述；即使没有规则匹配，也要让用户感觉被帮助到了。保持专业、共情、通俗。";
  const txt=await callDeepSeekAPI([{role:"system",content:sys},{role:"user",content:user}],{temperature:0.7,max_tokens:1000});
  const symptoms=opts.symptoms||detectSymptoms(text);
  const follow=followUpText(text, symptoms, opts.hasCheck||hasCheckResult(text));
  if(txt){ renderSymptomCard(txt, info, {followUp:follow, symptoms}); return; }
  renderOfflineFallback(text, info, {symptoms, follow});
}

function formatSymptom(txt){
  const esc=escapeHtml(txt);
  const parts=esc.split(/(【[^】]+】)/g);
  let out="";
  for(const p of parts){
    if(/^【[^】]+】$/.test(p)){ out+=`<div class="sym-sec"><b>${p}</b></div>`; }
    else { const t=p.replace(/\n/g,"<br>").trim(); if(t) out+=`<div class="sym-body">${t}</div>`; }
  }
  return out || `<div class="sym-body">${esc.replace(/\n/g,"<br>")}</div>`;
}

/* ============== 输入类型判断·结节追问 / 症状追问（本地兜底） ============== */
/* 结节类疾病判定（甲状腺/乳腺/肺/声带/皮下等结节） */
function isNoduleDisease(d){ return /结节/.test(d) && !/良性肿瘤|赘生物/.test(d); }
/* 结节类信息不足时的追问项 */
function noduleAskItems(perDisease){
  const need=new Set();
  for(const p of perDisease){
    if(!p.rule) continue;
    for(const q of (p.missing||[])){
      if(/直径|结节最大/.test(q)) need.add("结节<b>最大直径</b>（多少 cm / mm）");
      else if(/分级/.test(q)) need.add("检查报告的<b>分级</b>（TI-RADS / BI-RADS / Lung-RADS 等）");
      else if(/穿刺|病理|手术/.test(q)) need.add("是否已<b>穿刺活检 / 手术</b>，病理是否排除恶性");
    }
  }
  if(!need.size){
    need.add("结节<b>最大直径</b>（多少 cm / mm）");
    need.add("检查报告的<b>分级</b>（TI-RADS / BI-RADS / Lung-RADS 等）");
    need.add("是否已<b>穿刺活检 / 手术</b>，病理是否排除恶性");
  }
  return [...need];
}

    <div class="fin-box" style="background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a;margin-top:10px;">💡 补充上述信息后，我将按通用核保规则给出各险种结论（例如：≤1cm 且 TI-RADS ≤3 类的甲状腺结节，通常为医疗险除外、重疾险除外、增额寿标体）。具体承保结果以保险公司正式核保为准。</div>`;
  wrap.appendChild(card); chat.appendChild(wrap); scroll();

/* ===== 模糊词检索：输入既非明确疾病名/症状/检查异常，但可作关键词在规则库病名中检索 ===== */
function fuzzySearchDiseases(text){
  // 只对短片段、无语病、非整句描述的关键词做检索，避免把整段描述当关键词
  const kw=String(text||"").replace(/[，。、；：？！\s]/g,"").trim();
  if(!kw || kw.length>6) return [];
  const _SYN={"尿隐血":"尿潜血"};   /* C8: 尿隐血=尿潜血 同义归一（fuzzy 子串匹配无法跨字 rescue） */
  const hits=[];
  const seen=new Set();
  for(const d of DISEASES){
    const full=stripParen(d);
    if(full && full.indexOf(kw)>=0 && !seen.has(d)){ seen.add(d); hits.push(d); }
  }
  if(_SYN[kw]){ const _k2=_SYN[kw]; for(const d of DISEASES){ const full=stripParen(d); if(full && full.indexOf(_k2)>=0 && !seen.has(d)){ seen.add(d); hits.push(d); } } }
  // 仅当命中且数量适中（避免"结节/病"等过泛词返回上百条）时返回
  return (hits.length>0 && hits.length<=20) ? hits : [];
}

    ${ageHintHtml(info)}
    <div class="analysis">您输入的「<b>${escapeHtml(kw)}</b>」不是明确的疾病名或症状，但与以下疾病相关。请<b>点击选择</b>最接近您情况的疾病，我将为您匹配对应的核保规则：</div>

  wrap.appendChild(card); chat.appendChild(wrap); scroll();
}

/* ============== 主流程 ============== */
const ABBR_MAP = {
  "BP": "血压",
  "SBP": "收缩压",
  "DBP": "舒张压"
};
function sniffAbbr(text) {
  let result = text;
  for (const [abbr, full] of Object.entries(ABBR_MAP)) {
    const re = new RegExp(`\\b${abbr}\\b`, 'gi');
    if (re.test(result) && !result.includes(full)) {
      result = result.replace(re, full);
    }
  }
  return result;
}

// 血压数值嗅探 + 自动分级：BP/150/90/收缩压舒张压 等 → 自动补“高血压”关键词并标注分级
// 仅做 analyze 开头的文本预处理，不改匹配引擎、不改结论逻辑。
function sniffBloodPressure(text) {
  let result = text;
  // 检测血压数值：支持 150/90、血压150/90、收缩压150舒张压90 等格式
  let bp = null;
  let m = result.match(/(\d{2,3})\s*[\/／]\s*(\d{2,3})/);
  if (m) bp = { sb: parseInt(m[1]), db: parseInt(m[2]) };
  if (!bp) {
    m = result.match(/收缩压[：:\s]*?(\d{2,3})[^\d]*?舒张压[：:\s]*?(\d{2,3})/);
    if (m) bp = { sb: parseInt(m[1]), db: parseInt(m[2]) };
  }
  // 合理性护栏：排除明显非血压的数字串（如日期 1990/01 会被误读为 990/1）
  if (bp && (bp.sb < 50 || bp.sb > 300 || bp.db < 30 || bp.db > 200)) bp = null;
  if (bp) {
    let level = null;
    // 1级高血压
    if ((bp.sb >= 140 && bp.sb <= 159) || (bp.db >= 90 && bp.db <= 99)) level = "1级";
    // 2级高血压
    if ((bp.sb >= 160 && bp.sb <= 179) || (bp.db >= 100 && bp.db <= 109)) level = "2级";
    // 3级高血压
    if (bp.sb >= 180 || bp.db >= 110) level = "3级";
    if (level) {
      // 原文本无“高血压”关键词 → 自动补上；已有则追加分级标注
      if (!/高血压/.test(result)) {
        result = `高血压（${level}），${result}`;
      } else {
        result = result.replace(/高血压/, `高血压（${level}）`);
      }
    }
  }
  return result;
}

async function analyze(text){
  // ① 血压缩写嗅探：BP/SBP/DBP（大小写不敏感）→ 中文，便于后续匹配
  text = sniffAbbr(text);
  // ② 血压数值嗅探 + 自动补“高血压”关键词 + 分级标注（仅文本预处理，不改引擎/结论）
  text = sniffBloodPressure(text);
  // 对话状态：追问「以后还有机会吗 / 能改善吗」时，复用上一轮评估给出完整版风险改善指引
  const session = loadSession();
  if(session.lastPerDisease && session.lastPerDisease.length && /(以后|未来|之后|还能|还有机会|能改善|能保吗|转标体|有机会吗|改善吗|还能投|还能买|改善后|能不能保)/.test(text)){
    renderRiskFull(session.lastPerDisease, session.lastInfo||{});
    return;
  }
  // ===== 胸闷上下文拦截（试点，独立模块；安全开关 SYMPTOM_CTX.ENABLED_SYMPTOMS）=====
  if(SYMPTOM_CTX.isActive()){
    // 【疾病优先】若本轮输入本身命中规则库疾病（用户换话题 / 直接说出病名），
    // 立即释放上下文并把输入原样交回主流程出结论卡，不再被当成对上一轮追问的回复。
    if(SYMPTOM_CTX.isDiseaseInput(text)){
      SYMPTOM_CTX.release();
    }else{
      const _h = SYMPTOM_CTX.handle(text);
      if(_h.handled){
        if(_h.rule){
          // 明确诊断 → 复用真实规则引擎出结论卡片（上下文已释放，不会再次拦截）
          await analyze(_h.rule);
        }else{
          SYMPTOM_CTX.renderReply(_h.reply);
        }
        return;
      }
    }
  }
  const base = extractBase(text);
  let info = Object.assign({ disease:null, indicators:{} }, base);
  // 步骤一：优先用 DeepSeek 提取（网络/CORS 失败或超时则回退本地提取）
  const ds=await callDeepSeekExtract(text);
  if(ds){
    if(ds.age!=null) info.age=ds.age;
    if(ds.gender) info.gender=ds.gender;
    if(ds.intent) info.intent=ds.intent;
    if(ds.riskAmount!=null) info.riskAmount=ds.riskAmount;
    if(ds.annualIncome!=null) info.annualIncome=ds.annualIncome;
    if(ds.annualPremium!=null) info.annualPremium=ds.annualPremium;
  }
  // 疾病名标准化：把用户词（高血压/糖尿病/乙肝…）归一为标准规则名后再做定位与字段归属
  const norm = EXTRA_ALIAS.apply(applyDiseaseMap(text));   // 先底层 DISEASE_MAP，再补简称映射（冠心病/哮喘/贫血…）
  // 多疾病定位：本地片段命中（带位置）+ DeepSeek 病名，统一映射到标准全称
  let spans = findDiseaseSpans(norm).filter(s=>!CHECK_SKIP_DISEASES.has(s.disease));
  let dsUnresolved = [];
  if(ds && ds.disease){
    const _allNames = [].concat(ds.disease);
    const canon = dedupeToKnown(_allNames);
    for(const c of canon){ if(!spans.some(s=>s.disease===c)) spans.push({disease:c, label:ds.disease, start:0, end:norm.length, exact:false}); }
    // 20261021 批次B：AI 抽到了、但标准化后仍对不上规则库的病名（未收录），单独记下
    dsUnresolved = dedupeUnresolved(_allNames);
  }
  const hasDisease = spans.length>0;
  const symptoms = detectSymptoms(text);
  const checkNoRule = detectCheckNoRule(text);
  const hasCheck = hasCheckResult(text);

  // ===== 症状追问 release 后，对补充信息做二次检测（仅作用于刚释放后的下一轮；独立逻辑，不打断原流程）=====
  if(session.symptomCtxJustReleased){
    session.symptomCtxJustReleased = false; saveSession(session);
    // ① 检查异常关键词（CHECK_NO_RULE）→ 走检查异常问询
    if(checkNoRule.length){ renderCheckAsk(text, checkNoRule, info); return; }
    // ② 检查项提及（心电图/T波/ST段/胸片/CT/超声…，复用 hasCheckResult）→ 走检查异常问询
    if(hasCheck){ renderCheckAsk(text, ["检查异常"], info); return; }
    // ③ 疾病别名/病名已命中（hasDisease）→ 继续走下方规则卡片逻辑（不 return）
    // ④ 其余 → 原有兜底（下方 renderSymptomOrGentle），此处不拦截
  }

  /* ===== 统一入口判断逻辑 =====
     ① 明确疾病名 → 多病种组合 → 出结论卡片（下方 hasDisease 分支）
     ② 症状词 → 对话管理：追问检查/诊断；补充信息后若仍无法匹配 → 兜底
     ③ 检查异常 → 对话管理：追问指标/诊断；补充信息后若仍无法匹配 → 兜底
     ④ 模糊词（如"血压"）→ 检索规则库中包含该词的疾病列表
     ⑤ 其余 → 兜底（DeepSeek 分析 / 离线参考）
     核心原则：任何路径最终无法匹配规则时，统一走兜底（renderSymptomOrGentle→renderFallbackAnalysis）。 */
  if(!hasDisease){
    // 对话管理：若本轮是对上一轮「症状/检查异常」追问的补充，关联上下文继续兜底分析，而非当作全新输入
    const prevAsk = loadAskContext();
    if(prevAsk && isContinuationReply(text)){
      await renderSymptomOrGentle(text, info, { context: prevAsk.text, symptoms: prevAsk.words||[], hasCheck: hasCheckResult(text) });
      return;
    }
    const exams=detectSpecialExam(text);
    const tumor=detectTumorICD(text);
    if(exams.length||tumor.has){ renderExamOrTumorCard(text, exams, tumor, info); return; }
    if(detectPsycho(text).length){ renderPsychoCard(info); return; }
    // 20261021 批次A：防重复追问——上一轮已就同一检查项追问过，本轮补充后不再重复问，直接给方向性分析
    if(checkNoRule.length){
      if(prevAsk && prevAsk.type==="check" && (prevAsk.words||[]).some(w=>checkNoRule.indexOf(w)>=0)){
        await renderSymptomOrGentle(text, info, { context: prevAsk.text, symptoms, hasCheck: hasCheckResult(text) });
        return;
      }
      renderCheckAsk(text, checkNoRule, info); return;
    }
    if(symptoms.length){
      // 胸闷试点：命中启用症状且尚未进入上下文时，创建上下文并追问检查（其他症状走原有逻辑）
      const _sym = symptoms.find(s=>SYMPTOM_CTX.ENABLED_SYMPTOMS.indexOf(s)>=0);
      if(_sym && !SYMPTOM_CTX.isActive()){
        SYMPTOM_CTX.renderReply(SYMPTOM_CTX.create(_sym));
        return;
      }
      await renderSymptomAskOrAnalyze(text, symptoms, info, hasCheck); return;
    }
    // 批次C-批2：无诊断指标异常统一兜底——粗搜命中→模糊列表引导看规则；不中→静态兜底卡（不出 AI 分析）
    const _labsRuleHit=[], _labsNoRule=[];
    detectLabAbnormal(text).forEach(l=>{ (labSearchRule(l)?_labsRuleHit:_labsNoRule).push(l); });
    if(_labsNoRule.length){ renderLabFallbackCard(_labsNoRule, info); return; }
    if(_labsRuleHit.length){ const _rn=Array.from(new Set(_labsRuleHit.map(l=>labSearchRule(l)).filter(Boolean))); if(_rn.length){ renderFuzzyList(text, _rn, info); return; } }   /* C8: 直出命中规则名（fuzzy 搜 join 串在>6字时失效） */
    // 模糊词检索：输入既非疾病名/症状/检查异常，但可作为关键词在规则库病名中检索（如"血压"）
    const fuzzy = fuzzySearchDiseases(text);
    if(fuzzy && fuzzy.length){ renderFuzzyList(text, fuzzy, info); return; }
    // 20261021 批次C-批3：本地没认出病名，但 AI 抽到了规则库不认识的疾病 → 走 AI 风险分诊
    if(dsUnresolved.length){ renderAiRefCard(dsUnresolved, info); return; }
    await renderSymptomOrGentle(text, info); return;
  }

  // a. 逐疾病分别匹配，每个疾病只取其所在区段的指标（字段归属）
  const perDisease = spans.map((s,i)=>{
    const region = regionFor(norm, spans, i);
    const indicators = extractIndicators(region);
    const info_i = Object.assign({}, base, { indicators });
    const m = matchRules(RULES, info_i, s.disease);
    const label = LABEL_MAP[s.disease] || s.label;   // 还原为用户原词展示（高血压/糖尿病…）
    return { disease:s.disease, label, status:m.status, rule:m.rule, missing:m.missing };
  });
  if(!perDisease.some(p=>p.rule)){
    // 20261021 批次B：已识别到病名但规则库全部未收录 → 直接给 AI 参考三列倾向（不再问"可能是哪些病"）
    const _seenAll = new Set();
    const _nameList = perDisease.map(p=>DISPLAY_OVERRIDE.name(p.label||p.disease)).concat(dsUnresolved)
      .filter(n=>{ if(!n || _seenAll.has(n)) return false; _seenAll.add(n); return true; });
    if(_nameList.length){ renderAiRefCard(_nameList, info); return; }
    await renderSymptomOrGentle(text, info); return;
  }
  // b/c. 合并：先按险种分别取最严，再应用多疾病组合规则覆盖，最终综合结论取最严
  let anyManual=false; const strictList=[];
  for(const pd of perDisease){
    if(!pd.rule) continue;
    const dc=diseaseConclusion(pd.rule);
    if(dc.manual) anyManual=true;
    if(dc.strictest) strictList.push(dc.strictest);
  }
  let combined={
    manual: anyManual,
    strict: strictList.length ? strictList.reduce((a,b)=> RISK[a]>=RISK[b]?a:b) : "标体"
  };
  const combo=applyCombo(perDisease);
  let comboNote="", multiNote="";
  if(combo){ combined=combo.combined; comboNote=combo.comboNote; multiNote=combo.multiNote; }
  // 三列展示用：逐险种合并结论（多疾病用 applyCombo 的 cons；单疾病直接用该规则结论，保留增额寿 SPECIAL_EEV 等原值）
  const ruled = perDisease.filter(p=>p.rule);
  let cons = combo && combo.cons ? combo.cons : (ruled.length===1 ? ruled[0].rule.conclusions : {});
  const status = perDisease.some(p=>p.status==="reference") ? "reference" : "full_match";
  const missing = Array.from(new Set(perDisease.flatMap(p=>p.missing||[])));
  const fin=financialCheck(info);
  // 保存会话上下文（用于追问「以后还有机会吗」等），仅存可序列化的最小字段
  try{ saveSession({ lastPerDisease: perDisease.filter(p=>p.rule).map(p=>({disease:p.disease,label:p.label,rule:p.rule})), lastInfo:{age:info.age,gender:info.gender,intent:info.intent}, ts:Date.now() }); }catch(e){}
  // 展示层：注入用户原始输入词，供心电图异常类正文动态展示（如 心电图异常（T波倒置））
  info.origEcgWord = DISPLAY_OVERRIDE.origWord(text);
  const _labAll = detectLabAbnormal(text);
  const _labFb = _labAll.filter(l=>!labSearchRule(l));
  const _labRuleHit = _labAll.filter(l=>labSearchRule(l));   /* C8: 规则命中类单独引导，不再静默过滤 */
  if(_labFb.length || _labRuleHit.length) combined=Object.assign({},combined,{manual:true});   // 批次C-批2+C8：检验异常参与取最严（整单转人工）
  renderCard({ perDisease, combined, cons, status, missing, fin, comboNote, multiNote, unresolvedExtra: dsUnresolved, labFallback: _labFb, labRuleHit: _labRuleHit, psycho: detectPsycho(text).length>0, hadHospital: /住院|手术|术后|出院/.test(text), tumor: detectTumorICD(text) }, info);
}

/* 症状参考分析 + 追问闭环（需求五+六）：用 DeepSeek 给出 4 段式医学常识参考，并追问诊断/检查 */
async function renderSymptomAskOrAnalyze(text, symptoms, info, hasCheck){
  const sys="您是一位温和、专业的保险核保顾问医生。用户描述了一些症状或健康情况，但系统未在疾病规则库中找到完全匹配的疾病。请基于医学常识，用温和、专业、像医生向患者解释一样的语气，为用户提供以下结构化参考分析（请使用【】小标题组织，4 段都要有）：\n1. 【初步分析】该症状可能关联哪些疾病方向？（列举 2-3 个）\n2. 【核保参考】这些疾病方向在医疗险/重疾险中通常的核保倾向（标体/除外/拒保/延期）。例如：胆结石，单一疾病无其他既往史或异常，医疗险通常除外，重疾险通常标体。请结合用户具体症状给出类似核保参考。\n3. 【建议行动】建议用户做什么检查或补充什么信息来明确诊断\n4. 【免责声明】以上仅为基于症状的医学常识参考，具体以医生诊断和保险公司核保结论为准\n注意：不要使用“未找到匹配规则”等冷冰冰的技术表述；即使没有规则匹配，也要让用户感觉被帮助到了。保持专业、共情、通俗。";
  const user="用户描述的症状/情况："+text;
  const txt=await callDeepSeekAPI([{role:"system",content:sys},{role:"user",content:user}],{temperature:0.7,max_tokens:1000});
  const follow=followUpText(text, symptoms, hasCheck);
  if(txt){ renderSymptomCard(txt, info, {followUp:follow, symptoms}); }
  else { renderSymptomAsk(symptoms, info, hasCheck); }
  saveAskContext({type:"symptom", words:symptoms, text});
}

    <div class="fin-box" style="background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a;margin-top:10px;">💡 以上是针对「${names}」的进一步问询，并非核保结论。提供具体指标与诊断后，我可为您匹配对应的核保规则或给出医学常识参考；具体承保结果以医生诊断与保险公司正式核保为准。</div>`;

async function send(){
  const v=document.getElementById("msg").value.trim();
  if(v.length>LONG_TEXT_LEN && v.split(/[，,、;；\n]/).length<=1){ runExtract({text:v}); return; }   // 长文本且非预填病名串 → AI 抽取

  const t=document.createElement("div"); t.className="row ai"; t.innerHTML='<div class="bubble typing">正在分析…</div>'; chat.appendChild(t); scroll();

}

/* AI 抽取（20261020 V5.1）：deepseek-flash 多模态抽取（文字/图片统一管道），替代 Tesseract OCR + 正则扫描 */
const EXTRACT_PROMPT = '你是核保助理的信息抽取引擎。仔细阅读这份医学报告，提取：1) illnesses：医生明确诊断的疾病（出院诊断/印象为准，辅助检查与诊疗经过中明确提及的异常也可纳入；忽略否定语境如"未触及""无""否认"、模板占位如"据实填写"、医嘱建议语境如"如出现…及时就诊"）。疾病原文带分级/分型时必须保留并归一为「病名+N类」格式（如 TI-RADS 4a → 甲状腺结节4a类；BI-RADS 3 → 乳腺结节3类），严禁省略分级；2) abnormalLabs：异常化验/检查指标（名称+数值，如 CA125 升高、尿潜血阳性）；3) followup：医生建议的复查时间要求；4) history：手术/住院/确诊时间等病史要点（一句话概括，没有则空字符串）；5) malignantHint：布尔值——报告全文任意位置出现「恶性/癌/肿瘤/占位待查」等字样、但 illnesses 未包含对应疾病时置 true，否则 false。只输出JSON：{"illnesses":[],"abnormalLabs":[],"followup":"","history":"","malignantHint":false}，不要输出其他文字。';
const LONG_TEXT_LEN = 60;
async function extractWithFlash(payload){
  const content=[];
  const _imgs=(payload.images&&payload.images.length)?payload.images:(payload.imageDataUrl?[payload.imageDataUrl]:[]);
  _imgs.forEach(u=>content.push({type:"image_url", image_url:{url:u}}));
  if(payload.text) content.push({type:"text", text:payload.text});
  content.push({type:"text", text:EXTRACT_PROMPT});
  const r=await fetch("/api/deepseek", { method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ model:"deepseek-flash", messages:[{role:"user",content}], temperature:0.2, max_tokens:2000, thinking:{type:"disabled"} }) });
  if(!r.ok){
    let _d=""; try{ const _j=await r.json(); _d=(_j&&(_j.error||_j.message))||""; }catch(_e){}
    const _msg = r.status===401 ? "密钥无效或已过期（请检查服务端 DEEPSEEK_API_KEY）"
      : (r.status===500||r.status===502) ? "服务端未配置密钥或代理异常（请检查 Vercel 环境变量 DEEPSEEK_API_KEY 并重新部署）"
      : r.status===413 ? "图片体积过大，请压缩后重试"
      : "接口异常 HTTP "+r.status+(_d?"："+_d:"");
    throw new Error(_msg);
  }
  const d=await r.json();
  let t=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||"").trim();
  const m=t.match(/\{[\s\S]*\}/);            // JSON 容错：容忍 markdown 代码块包裹
  if(!m) throw new Error("empty");
  let j; try{ j=JSON.parse(m[0]); }catch(e){ throw new Error("parse"); }
  return { illnesses:(j.illnesses||[]).map(String).filter(Boolean),
           abnormalLabs:(j.abnormalLabs||[]).map(String).filter(Boolean),
           followup:String(j.followup||""),
           history:String(j.history||""),
           malignantHint:j.malignantHint===true };
}
/* 用户气泡（富文本）：展示粘贴原文与图片缩略图，让用户能确认系统实际读到的内容 */
function addUserRich(label, bodyHtml){
  const r=document.createElement("div"); r.className="row user";
  const b=document.createElement("div"); b.className="bubble";
  b.innerHTML='<div style="font-size:11.5px;opacity:.75;margin-bottom:4px;">'+escapeHtml(label)+'</div>'+(bodyHtml||'');
  r.appendChild(b); chat.appendChild(r); scroll();
}
function pastePreviewHtml(text){
  const t=String(text||"");
  return '<div style="max-height:120px;overflow:auto;white-space:pre-wrap;font-size:12.5px;line-height:1.65;">'+escapeHtml(t)+'</div>'+
         '<div style="font-size:11px;opacity:.55;margin-top:2px;">共 '+t.length+' 字（可在框内滚动查看全文）</div>';
}
/* 病名合并：保留输入框已有内容并去重追加（多图/多次粘贴不再互相覆盖） */
function mergeNameList(prev, add){
  const split=v=>String(v||"").split(/[、,，;；\n]+/).map(x=>x.trim()).filter(Boolean);
  const out=split(prev);
  for(const n of (add||[])){ if(out.indexOf(n)<0) out.push(n); }
  return out.join("、");
}
/* 分析输入：病名 + 异常指标。影像描述类指标（含结节/囊肿等词）会与病名重复匹配，故过滤 */
function buildAnalyzeText(ext){
  const base=document.getElementById("msg").value||"";
  const labs=((ext&&ext.abnormalLabs)||[]).filter(x=>!/结节|囊肿|息肉|占位|肿块|淋巴结/.test(x));
  return labs.length ? (base+"（异常指标："+labs.join("；")+"）") : base;
}
function showExtractResult(ext){
  const merged=mergeNameList(document.getElementById("msg").value, ext.illnesses);
  if(merged) document.getElementById("msg").value=merged;
  const card=document.createElement("div"); card.className="card";
  let html='<div class="sec-title">识别到的疾病</div><div class="ocr-text">'+escapeHtml(ext.illnesses.join("、")||"（未识别到明确疾病）")+'</div>';
  if(ext.abnormalLabs.length){
    html+='<div class="fin-box" style="background:#fffbeb;border-color:#fcd34d;color:#92400e;margin-top:8px;"><div class="f-title">⚠️ 识别到异常指标</div><div>'+ext.abnormalLabs.map(x=>escapeHtml(x)).join("；")+'。核保可能关注，建议告知时一并说明。</div></div>';
  }
  if(ext.history) html+='<div style="color:#64748b;font-size:12.5px;margin-top:6px;">病史要点：'+escapeHtml(ext.history)+'</div>';
  if(ext.followup) html+='<div style="color:#64748b;font-size:12.5px;margin-top:6px;">医生建议：'+escapeHtml(ext.followup)+'</div>';
  if(ext.malignantHint){
    html+='<div class="fin-box" style="background:#fef2f2;border-color:#fecaca;color:#991b1b;margin-top:8px;"><div class="f-title">⚠️ 疑似恶性/肿瘤表述提醒</div><div>报告中的「恶性/癌/肿瘤」相关表述可能未被完整识别为诊断。请务必人工核对诊断全文，确认无恶性病史后再投保；如有疑问请直接申请人工核保。</div></div>';
  }
  html+='<div style="color:#64748b;font-size:12.5px;margin-top:6px;">⚠ 如有遗漏或识别错误，请直接在输入框修改补充后发送。请特别注意核对<b>分级（如 4a/4b）</b>与<b>恶性/良性</b>表述是否被完整识别。</div>';
  card.innerHTML=html;
  const box=document.createElement("div"); box.className="row ai";
  card.appendChild((()=>{ const b=document.createElement("button"); b.className="btn btn-send"; b.style.marginTop="10px"; b.textContent="确认无误，生成核保建议"; b.onclick=()=>{ box.remove(); analyze(buildAnalyzeText(ext)); }; return b; })());
  card.appendChild;
  box.appendChild(card); chat.appendChild(box); scroll();
}
/* 批次C-批2：无病名时的检验异常静态兜底卡（不出 AI 分析——无诊断不编方向，只给复查/就诊/人工核保流程） */

function extractFail(msg){
  const t=document.createElement("div"); t.className="row ai";
  const card=document.createElement("div"); card.className="card";
  card.innerHTML='<div class="fin-box" style="background:#fef2f2;border-color:#fecaca;color:#991b1b;">⚠️ AI 识别失败（'+escapeHtml(msg)+'）。请直接在下方输入框手动输入疾病名称，再点击发送。<br><span style="font-size:12px;color:#b91c1c;">提示：AI 识别需在部署后的线上环境使用（本地打开的页面无服务端代理）。</span></div>';
  card.appendChild; const box=document.createElement("div"); box.className="row ai"; box.appendChild(card); chat.appendChild(box); scroll();
}
async function runExtract(payload){
  const _imgs=(payload.images&&payload.images.length)?payload.images:(payload.imageDataUrl?[payload.imageDataUrl]:[]);
  if(_imgs.length){
    const thumbs=_imgs.map(u=>'<img src="'+u+'" alt="报告图片" style="width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid #e2e8f0;">').join("");
    addUserRich("📷 已上传报告图片 "+_imgs.length+" 张（AI 识别中）", '<div style="display:flex;flex-wrap:wrap;gap:4px;">'+thumbs+'</div>');
  }else{
    addUserRich("📋 已粘贴报告文字（AI 识别中）", pastePreviewHtml(payload.text));
  }
  document.getElementById("loading").style.display="flex";
  try{
    const ext=await extractWithFlash(payload);
    document.getElementById("loading").style.display="none";
    if(!ext.illnesses.length && !ext.abnormalLabs.length){
      extractFail("未能识别到明确的疾病或异常指标"); return;
    }
    showExtractResult(ext);
  }catch(err){
    document.getElementById("loading").style.display="none";
    extractFail(err.message||"未知错误");
  }
}
function uploadImg(){ document.getElementById("fileInput").click(); }
/* ---- 图片压缩（20261021 批次A）----
   目的：规避 Vercel 服务端函数 4.5MB 请求体上限（原图直传 + base64 膨胀 1.37 倍，>3.2MB 即 413）。
   参数取舍：长边 2200px 保证 A4 整页报告的小字仍可辨认；单张目标 ≤600KB；最多 3 张。 */
const IMG_MAX_N=3, IMG_MAX_EDGE=2200, IMG_QUALITY=0.82, IMG_TARGET=600*1024;
function dataUrlBytes(u){ const i=String(u).indexOf(","); return Math.round((String(u).length-(i<0?0:i+1))*0.75); }
async function decodeImageFile(file){
  // 优先 createImageBitmap：带 imageOrientation 可按 EXIF 正位，避免手机竖拍压缩后倒 90°
  try{ if(typeof createImageBitmap==="function"){ return await createImageBitmap(file,{imageOrientation:"from-image"}); } }catch(e){}
  return await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error("decode")); im.src=URL.createObjectURL(file); });
}
function canvasToJpeg(src, edgeMax, quality){
  const sw=src.width||src.naturalWidth||0, sh=src.height||src.naturalHeight||0;
  if(!sw||!sh) throw new Error("decode");
  const sc=Math.min(1, edgeMax/Math.max(sw,sh));
  const w=Math.max(1,Math.round(sw*sc)), h=Math.max(1,Math.round(sh*sc));
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  const ctx=cv.getContext("2d");
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);   // 透明底转白底，避免 JPEG 出现黑底
  ctx.drawImage(src,0,0,w,h);
  return cv.toDataURL("image/jpeg",quality);
}
async function compressImage(file){
  try{
    const src=await decodeImageFile(file);
    let q=IMG_QUALITY, u=canvasToJpeg(src,IMG_MAX_EDGE,q);
    while(dataUrlBytes(u)>IMG_TARGET && q>0.56){ q=Math.round((q-0.09)*100)/100; u=canvasToJpeg(src,IMG_MAX_EDGE,q); }
    if(dataUrlBytes(u)>IMG_TARGET){ u=canvasToJpeg(src,1600,0.7); }
    try{ if(src.close) src.close(); }catch(e){}
    return u;
  }catch(err){
    // HEIC 等浏览器无法解码的格式 → 退回原图，避免整条上传链断掉
    return await new Promise((res,rej)=>{ const rd=new FileReader(); rd.onload=ev=>res(ev.target.result); rd.onerror=()=>rej(new Error("read")); rd.readAsDataURL(file); });
  }
}
async function onImgSelected(e){
  const picked=Array.prototype.slice.call(e.target.files||[]);
  e.target.value="";
  if(!picked.length) return;
  const files=picked.slice(0,IMG_MAX_N);
  document.getElementById("loading").style.display="flex";
  const urls=[];
  for(const f of files){
    try{ urls.push(await compressImage(f)); }catch(err){ /* 单张失败不影响其余 */ }
  }
  document.getElementById("loading").style.display="none";
  if(!urls.length){ extractFail("图片读取失败（格式不支持或文件损坏）"); return; }
  if(picked.length>IMG_MAX_N){
    addUserRich("📷 已选择 "+picked.length+" 张，单次最多 "+IMG_MAX_N+" 张", '<div style="font-size:12.5px;color:#92400e;">本次已处理前 '+IMG_MAX_N+' 张，其余请再次上传（结果会自动合并）。</div>');
  }
  runExtract({images:urls});
}
function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* 粘贴 */
function openPaste(){ document.getElementById("modal").style.display="flex"; document.getElementById("pasteArea").focus(); }
function closePaste(){ document.getElementById("modal").style.display="none"; }
function doPaste(){
  const v=document.getElementById("pasteArea").value.trim();
  if(!v){ alert("请先粘贴文字内容"); return; }
  closePaste();
  if(v.length>LONG_TEXT_LEN){ runExtract({text:v}); return; }   // 长文本/报告 → AI 抽取后预填确认
  addUserRich("📋 已粘贴报告文字", pastePreviewHtml(v));
  analyze(v);
}
