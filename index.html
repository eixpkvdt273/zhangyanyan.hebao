  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }
  header { background: linear-gradient(135deg, #2563eb, #4f46e5); color: #fff; padding: 18px 20px; text-align: center; }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  header .sub { font-size: 14px; opacity: .92; margin-top: 4px; }
  header .intro { font-size: 12.5px; opacity: .82; margin-top: 6px; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; width: 100%; }
  .row.user { justify-content: flex-end; }
  .row.ai { justify-content: flex-start; }
  .bubble { max-width: 86%; padding: 11px 14px; border-radius: 14px; font-size: 14px; line-height: 1.6; word-break: break-word; }
  .row.user .bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .row.ai .bubble { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; width: 92%; max-width: 620px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
  .card .disease { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card .icd { font-size: 12px; color: var(--sub); background: #f1f5f9; padding: 2px 8px; border-radius: 6px; font-weight: 400; }
  .tag { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; color: #fff; }
  .t-通过,.t-标体 { background: var(--green); }
  .t-拒保 { background: var(--red); }
  .t-延期 { background: var(--orange); }
  .t-除外 { background: #d97706; }
  .t-转人工 { background: var(--blue); }
  .cls-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin: 14px 0; }
  .cls-cell { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; }
  .cls-cell .lab { font-size: 12px; color: var(--sub); margin-bottom: 6px; }
  .cls-cell .val { font-size: 13px; font-weight: 700; }
  .sec-title { font-size: 13px; font-weight: 700; color: var(--primary-d); margin: 12px 0 6px; display: flex; align-items: center; gap: 6px; }
  .sec-title::before { content: ""; width: 4px; height: 14px; background: var(--primary); border-radius: 2px; }
  .analysis { font-size: 13.5px; line-height: 1.75; color: #334155; background: #f8fafc; border-left: 3px solid var(--primary); padding: 10px 12px; border-radius: 6px; }
  .mat-list, .fin-list { list-style: none; font-size: 13px; line-height: 1.7; }
  .mat-list li::before { content: "•"; color: var(--primary); margin-right: 8px; font-weight: 700; }
  .fin-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 12px; font-size: 13px; line-height: 1.7; color: #92400e; }
  .fin-box.need { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
  .fin-box .f-title { font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .hint { font-size: 12.5px; color: var(--sub); background: #eff6ff; border: 1px dashed #bfdbfe; border-radius: 8px; padding: 10px; margin-top: 10px; }
  .ref-badge { font-size: 11px; background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
  .typing { color: var(--sub); font-size: 13px; font-style: italic; }
  #inputBar { background: #fff; border-top: 1px solid var(--line); padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #msg { flex: 1; min-width: 200px; border: 1px solid var(--line); border-radius: 22px; padding: 10px 16px; font-size: 14px; outline: none; }
  #msg:focus { border-color: var(--primary); }
  .btn { border: none; border-radius: 22px; padding: 10px 16px; font-size: 14px; cursor: pointer; font-weight: 600; }
  .btn-send { background: var(--primary); color: #fff; }
  .btn-send:hover { background: var(--primary-d); }
  .btn-up { background: #eef2ff; color: var(--primary-d); }
  .btn-up:hover { background: #e0e7ff; }
  #loading { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 50; }
  #loading div { background: #fff; padding: 18px 24px; border-radius: 12px; font-size: 14px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--primary); width: 0; transition: width .2s; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
  #modal .box { background: #fff; border-radius: 14px; padding: 18px; width: 100%; max-width: 520px; }
  #modal h3 { font-size: 15px; margin-bottom: 10px; }

  #modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .examples { font-size: 12px; color: var(--sub); padding: 0 16px 12px; }
  .examples span { display: inline-block; background: #e2e8f0; padding: 3px 10px; border-radius: 14px; margin: 3px 4px 0 0; cursor: pointer; }
  .examples span:hover { background: #cbd5e1; }
  .img-prev { max-width: 100%; border-radius: 8px; margin-top: 8px; border: 1px solid var(--line); }
  .ocr-text { font-size: 12.5px; color: #334155; background: #f8fafc; border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-top: 8px; max-height: 120px; overflow: auto; white-space: pre-wrap; }
  .summary { background: #eef2ff; border: 1px solid #c7d2fe; color: #1e3a8a; border-radius: 8px; padding: 8px 12px; font-size: 13.5px; font-weight: 600; margin-bottom: 10px; line-height: 1.5; }
  .focus-box { font-size: 12.5px; line-height: 1.85; color: #334155; background: #f8fafc; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 4px; }
  .focus-box b { color: var(--primary-d); }
  .disclaimer { font-size: 11px; color: var(--sub); text-align: center; padding: 8px 14px; background: #fff; border-top: 1px solid var(--line); line-height: 1.5; }
</style>

  <button class="btn btn-up" onclick="openPaste()">📋 粘贴文字</button>

/* ============== 基础工具 ============== */
const RISK = {"拒保":5,"延期":4,"除外":3,"转人工":2,"通过":1,"标体":1};
const FIELD_ALIASES = {"高压":"收缩压","低压":"舒张压","岁":"年龄","结节大小":"结节最大直径","结节直径":"结节最大直径"};
function normField(k){ if(k==null) return ""; k=String(k).trim(); if(k in FIELD_ALIASES) return FIELD_ALIASES[k]; for(const a in FIELD_ALIASES){ if(k.indexOf(a)>=0) return FIELD_ALIASES[a]; } return k; }
function norm(s){ return String(s==null?"":s).replace(/\s+/g,""); }
function extractNum(s){ const m=String(s).match(/(\d+(?:\.\d+)?)/); return m?parseFloat(m[1]):null; }
function compare(v,op,t){ op={"≥":">=","≤":"<=","＞":">","＜":"<",">":">","<":"<"}[op]||op; if(op===">=")return v>=t; if(op==="<=")return v<=t; if(op===">")return v>t; if(op==="<")return v<t; return false; }
function stripParen(s){ return norm(s).replace(/[（(].*?[)）]/g,""); }
function diseaseMatch(user,rule){ const u=norm(user),r=norm(rule); if(!u||!r)return false; if(u===r)return true; if(u===stripParen(r))return true; return u.indexOf(r)>=0||r.indexOf(u)>=0; }

/* 所有疾病名（去重），用于信息提取时匹配 */
const DISEASES = (function(){ const seen=new Set(); const arr=[]; for(const r of RULES){ if(r.disease&&!seen.has(r.disease)){ seen.add(r.disease); arr.push(r.disease); } } return arr; })();

/* ============== 信息提取 ============== */
function extractInfo(text){
  const info = { age:null, gender:null, disease:null, intent:null, indicators:{} };
  // 疾病名：双向匹配。对每件疾病拆出关键词片段，取在 text 中命中的【最长片段】对应的疾病
  let best=null, bestLen=0;
  for(const d of DISEASES){
    const keys=[d, stripParen(d)];
    d.split(/[、，,（(]/).forEach(seg=>{ const s=seg.replace(/[）)]/g,'').trim(); if(s.length>=2) keys.push(s); });
    let hit=0;
    for(const k of keys){ if(k && text.indexOf(k)>=0) hit=Math.max(hit,k.length); }
    if(hit>bestLen){ bestLen=hit; best=d; }
  }
  info.disease = best;
  // 年龄
  let m=text.match(/(\d+)\s*岁/); if(m) info.age=parseInt(m[1]);
  // 性别
  if(/男/.test(text)&&!/女/.test(text)) info.gender="男"; else if(/女/.test(text)&&!/男/.test(text)) info.gender="女";
  // 险种意图
  if(/重疾/.test(text)) info.intent="重疾险"; else if(/医疗/.test(text)) info.intent="医疗险"; else if(/(增额|寿险|年金)/.test(text)) info.intent="增额寿";
  // 收缩压/舒张压：支持 "收缩压140""高压140""血压 140/90""140/90"
  let sm=text.match(/(?:收缩压|高压)[^\d]*?(\d{2,3})/);
  let dm=text.match(/(?:舒张压|低压)[^\d]*?(\d{2,3})/);
  if(!sm&&!dm){ const mm=text.match(/(\d{2,3})\s*[\/／]\s*(\d{2,3})/); if(mm){ sm=[0,mm[1]]; dm=[0,mm[2]]; } }
  if(sm) info.indicators["收缩压"]=parseFloat(sm[1]);
  if(dm) info.indicators["舒张压"]=parseFloat(dm[1]);
  // 结节最大直径
  let nm=text.match(/结节[^。，,；;]*?(\d+(?:\.\d+)?)\s*(?:cm|毫米|mm|MM|CM)/);
  if(nm) info.indicators["结节最大直径"]=parseFloat(nm[1]);
  // TI-RADS 分级
  let tm=text.match(/(TI-RADS|分级)\s*[:：]?\s*(\d)\s*级/i); if(tm) info.indicators["分级"]=tm[2]+"级";
  // 常见枚举关键词
  if(/已手术|手术切除|术后/.test(text)) info.indicators["手术史"]="是";
  if(/恶性|癌变|ca |CA /.test(text)) info.indicators["恶性"]="是";
  if(/除外|免责/.test(text)) {}
  // 财务相关
  let bm=text.match(/风险保额[^\d]*?(\d+(?:\.\d+)?)\s*万/); if(bm) info.riskAmount=parseFloat(bm[1])*10000;
  let am=text.match(/保额[^\d]*?(\d+(?:\.\d+)?)\s*万/); if(am&&info.riskAmount==null) info.riskAmount=parseFloat(am[1])*10000;
  let ym=text.match(/年收入[^\d]*?(\d+(?:\.\d+)?)\s*万/); if(ym) info.annualIncome=parseFloat(ym[1])*10000;
  let pm=text.match(/(?:年交|期交|每年)[^\d]*?(\d+(?:\.\d+)?)\s*万/); if(pm) info.annualPremium=parseFloat(pm[1])*10000;
  return info;
}

/* ============== 匹配引擎（复刻 v3 + best-effort） ============== */
function evaluateValue(userVal, cond){
  const u=String(userVal==null?"":userVal).trim(), r=String(cond||"").trim();
  if(!u||!r) return false;
  if(u===r) return true;
  if(r.indexOf(u)===0 && r.length>u.length && "，,、".indexOf(r[u.length])>=0) return true;
  if(r.indexOf("、")>=0||r.indexOf(",")>=0){ const opts=r.split(/[、,，]/).map(x=>x.trim()); if(opts.indexOf(u)>=0) return true; }
  let m=r.match(/^(\d+(?:\.\d+)?)\s*[-~—到至]\s*(\d+(?:\.\d+)?)/);
  if(m){ const uv=extractNum(u); if(uv!=null) return parseFloat(m[1])<=uv&&uv<=parseFloat(m[2]); }
  m=r.match(/^([≥≤＞＜<>])\s*(\d+(?:\.\d+)?)/);
  if(m){ const uv=extractNum(u); if(uv!=null) return compare(uv,m[1],parseFloat(m[2])); }
  if(r.indexOf("及以上")>=0){ const base=r.replace("及以上","").trim(); if(u===base) return true; const bv=extractNum(base),uv=extractNum(u); if(bv!=null&&uv!=null) return uv>=bv; }
  return false;
}
function evalBP(cond, indicators){
  const parts=cond.split(/[，,；;]|\s+且\s+|\s+或\s+/);
  const hasAnd=cond.indexOf("且")>=0; const subs=[];
  for(const p of parts){ const m=p.match(/(收缩压|舒张压)\s*([≥≤＞＜<>])\s*(\d+(?:\.\d+)?)/); if(m) subs.push([m[1],m[2],parseFloat(m[3])]); }
  if(!subs.length) return false;
  const res=[];
  for(const [name,op,target] of subs){ const uv=indicators[name]; if(uv==null) return false; const v=extractNum(uv); if(v==null) return false; res.push(compare(v,op,target)); }
  return hasAnd?res.every(x=>x):res.some(x=>x);
}
function condMatches(cond, info){
  const q=cond.q, a=cond.a, ind=info.indicators||{};
  if(q.indexOf("年龄")>=0){ if(info.age==null) return false; return evaluateValue(info.age, a); }
  if(q.indexOf("血压")>=0||a.indexOf("收缩压")>=0||a.indexOf("舒张压")>=0) return evalBP(a, ind);
  if(q.indexOf("性别")>=0){ if(info.gender==null) return false; return evaluateValue(info.gender, a); }
  // 枚举：按 q 在 indicators 找值
  for(const k in ind){ if(k&&(q.indexOf(k)>=0||k.indexOf(q)>=0)) return evaluateValue(ind[k], a); }
  // 特定枚举关键词
  if(q.indexOf("手术")>=0 && ind["手术史"]) return evaluateValue(ind["手术史"],a);
  if(q.indexOf("恶性")>=0 && ind["恶性"]) return evaluateValue(ind["恶性"],a);
  if(q.indexOf("分级")>=0 && ind["分级"]) return evaluateValue(ind["分级"],a);
  if(q.indexOf("结节最大直径")>=0 && ind["结节最大直径"]!=null) return evaluateValue(ind["结节最大直径"], a);
  return false;
}
function ruleMatches(rule, info){ for(const c of rule.conditions){ if(!condMatches(c,info)) return false; } return true; }
function strictScore(rule){ const v=Object.values(rule.conclusions||{}).filter(x=>x); if(!v.length) return 0; return Math.max(...v.map(x=>RISK[x]||0)); }
function collectQuestions(cands){ const seen=new Set(), out=[]; for(const r of cands){ for(const c of r.conditions){ if(!seen.has(c.q)){ seen.add(c.q); out.push(c.q); } } } return out; }
function missingFields(questions, info){
  const prov=new Set(Object.keys(info.indicators||{})); const miss=[];
  for(const q of questions){
    if(q.indexOf("年龄")>=0){ if(info.age==null) miss.push(q); continue; }
    if(q.indexOf("性别")>=0){ if(info.gender==null) miss.push(q); continue; }
    if(q.indexOf("血压")>=0||q.indexOf("收缩压")>=0||q.indexOf("舒张压")>=0){ if(!prov.has("收缩压")||!prov.has("舒张压")) miss.push(q); continue; }
    if(q.indexOf("手术")>=0){ if(!prov.has("手术史")) miss.push(q); continue; }
    if(q.indexOf("恶性")>=0){ if(!prov.has("恶性")) miss.push(q); continue; }
    if(q.indexOf("分级")>=0){ if(!prov.has("分级")) miss.push(q); continue; }
    if(q.indexOf("结节最大直径")>=0){ if(!prov.has("结节最大直径")) miss.push(q); continue; }
    if(prov.has(q)) continue;
    if([...prov].some(k=>k&&(q.indexOf(k)>=0||k.indexOf(q)>=0))) continue;
    miss.push(q);
  }
  return miss;
}
function matchRules(rules, info){
  const cands=rules.filter(r=>diseaseMatch(info.disease||"", r.disease));
  if(!cands.length) return {status:"no_match", rule:null, missing:null};
  // 严格匹配
  const full=cands.filter(r=>ruleMatches(r, info));
  if(full.length===1) return {status:"full_match", rule:full[0], missing:null};
  if(full.length>1){ full.sort((a,b)=>strictScore(b)-strictScore(a)); return {status:"full_match", rule:full[0], missing:null}; }
  // best-effort：信息不全时，选 满足最多条件 > 良性路径(非拒保/延期) > 风险最宽松 的规则作初步参考
  let best=null, bestRank=null;
  const rankOf=(r)=>{
    let sat=0; for(const c of r.conditions){ if(condMatches(c,info)) sat++; }
    const concl=Object.values(r.conclusions);
    const benign=!concl.some(v=>v==="拒保"||v==="延期");
    const friendly=concl.some(v=>v==="通过"||v==="标体")?0:strictScore(r);
    return [-sat, benign?0:1, friendly];
  };
  for(const r of cands){
    const rk=rankOf(r);
    if(best===null || rk[0]<bestRank[0] || (rk[0]===bestRank[0]&&rk[1]<bestRank[1]) || (rk[0]===bestRank[0]&&rk[1]===bestRank[1]&&rk[2]<bestRank[2])){ best=r; bestRank=rk; }
  }
  const miss=missingFields(collectQuestions(cands), info);
  return {status:"reference", rule:best, missing:miss};
}

function materialList(missing){

/* ============== DeepSeek API（统一调用：同域代理 → 直连 → 兜底） ============== */
/* 安全说明：客户端不内置密钥。部署到 Vercel 时由 api/deepseek.js 代理（密钥存环境变量）；
   本地测试可运行 proxy.py 启动同源代理。直接 file:// 打开时 DeepSeek 不可用，自动走默认话术。 */
const DEEPSEEK_KEY = "";                 // 留空：密钥仅在服务端代理中配置
const DEEPSEEK_MODEL = "deepseek-chat";
const DEEPSEEK_API = "https://api.deepseek.com/v1/chat/completions";

async function callDeepSeekAPI(messages, opts={}){
  const model=opts.model||DEEPSEEK_MODEL, temperature=opts.temperature??0.6, max_tokens=opts.max_tokens??400;
  const payload={model, messages, temperature, max_tokens};
  // 1) 同域代理（Vercel /api/deepseek 或本地 proxy.py 提供的同源接口）
  try{
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(), 6000);
    const r=await fetch("/api/deepseek",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),signal:ctrl.signal});
    clearTimeout(to);
    if(r.ok){ const d=await r.json(); const t=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content; if(t&&t.trim()) return t.trim(); }
  }catch(e){ /* 代理不可用，转直连 */ }
  // 2) 直连（仅当客户端配置密钥且 API 允许跨域；file:// 下通常会被 CORS 拦截）
  if(DEEPSEEK_KEY){
    try{
      const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(), 8000);
      const r=await fetch(DEEPSEEK_API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+DEEPSEEK_KEY},body:JSON.stringify(payload),signal:ctrl.signal});
      clearTimeout(to);
      if(r.ok){ const d=await r.json(); const t=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content; if(t&&t.trim()) return t.trim(); }
    }catch(e){ /* CORS/网络失败 */ }
  }
  return null;  // 调用失败 → 由调用方使用默认话术/本地提取
}

/* 步骤一：DeepSeek 提取结构化信息（疾病名 / 年龄 / 险种 / 指标 / 财务） */
async function callDeepSeekExtract(text){
  const sys="你是保险核保信息提取助手。请从用户描述中提取核保所需结构化信息，仅输出一个 JSON 对象（不要任何解释、不要 markdown 代码块）。字段：disease(标准疾病名字符串), age(数字或 null), gender('男'/'女'/null), intent('医疗险'/'重疾险'/'增额寿'/null), indicators(对象，可含 收缩压/舒张压/结节最大直径/分级/手术史/恶性 等键，值为字符串), riskAmount(风险保额，单位万元，数字或null), annualIncome(年收入，万元，数字或null), annualPremium(年交保费，万元，数字或null)。疾病名尽量使用标准医学名词。";
  const user="用户描述："+text;
  const txt=await callDeepSeekAPI([{role:"system",content:sys},{role:"user",content:user}],{temperature:0.2,max_tokens:400});
  if(!txt) return null;
  try{
    const m=txt.match(/\{[\s\S]*\}/); if(!m) return null;
    const o=JSON.parse(m[0]);
    return {
      age:o.age??null, gender:o.gender??null, disease:o.disease||null, intent:o.intent||null,
      indicators:o.indicators||{},
      riskAmount:o.riskAmount!=null?o.riskAmount*10000:null,
      annualIncome:o.annualIncome!=null?o.annualIncome*10000:null,
      annualPremium:o.annualPremium!=null?o.annualPremium*10000:null
    };
  }catch(e){ return null; }
}

/* 步骤三：DeepSeek 生成核保分析话术（失败则保留默认话术） */
async function callDeepSeek(res, info, analysisEl){
  if(!res||!res.rule||!analysisEl) return;
  const r=res.rule, c=r.conclusions, dn=r.disease.replace(/[（(].*?[)）]/g,"");
  const intent=info.intent||"重疾险";
  const sys="你是资深保险核保专家。请用专业但通俗易懂的语言（称呼用户为'您'），基于给出的疾病、年龄、性别、投保险种意向与各险种初步结论，写一段核保分析：先一句话点明结论，再说明核保关注点，最后给一句投保建议。不超过200字。文末说明：以上为初步参考，非最终承保决定。";
  const user=`疾病：${dn}\n年龄：${info.age||"未提供"}\n性别：${info.gender||"未提供"}\n投保险种意向：${intent}\n初步结论：医疗险${c["医疗险"]||"—"}、重疾险${c["重疾险"]||"—"}、增额寿${c["增额寿"]||"—"}`;
  const txt=await callDeepSeekAPI([{role:"system",content:sys},{role:"user",content:user}],{temperature:0.6,max_tokens:420});
  if(txt){ analysisEl.textContent=txt+"\n\n（以上由 AI 辅助生成，仅供参考，最终以保险公司正式核保为准）"; }
}

/* ============== 主流程 ============== */
async function analyze(text){
  const local=extractInfo(text);
  let info=local;
  // 步骤一：优先用 DeepSeek 提取（网络/CORS 失败或超时则回退本地提取）
  const ds=await callDeepSeekExtract(text);
  if(ds){
    if(ds.disease) info.disease=ds.disease;
    if(ds.age!=null) info.age=ds.age;
    if(ds.gender) info.gender=ds.gender;
    if(ds.intent) info.intent=ds.intent;
    Object.assign(info.indicators, ds.indicators||{});
    if(ds.riskAmount!=null) info.riskAmount=ds.riskAmount;
    if(ds.annualIncome!=null) info.annualIncome=ds.annualIncome;
    if(ds.annualPremium!=null) info.annualPremium=ds.annualPremium;
  }
  if(!info.disease){ renderNoMatch(info); return; }
  const res=matchRules(RULES, info);
  if(res.status==="no_match"){ renderNoMatch(info); return; }
  renderCard(res, info);
}

}

/* OCR */
function uploadImg(){ document.getElementById("fileInput").click(); }
function onImgSelected(e){
  const f=e.target.files[0]; if(!f) return;
  // 点击上传后立即显示「正在识别…」
  document.getElementById("loading").style.display="flex";
  const rd=new FileReader(); rd.onload=ev=>{
    const url=ev.target.result;
    const prog=document.getElementById("prog");
    if(typeof Tesseract==="undefined"){ alert("OCR 组件未加载，请检查网络连接（首次使用需联网下载中文识别模型）。"); document.getElementById("loading").style.display="none"; return; }
    Tesseract.recognize(f, 'chi_sim', { logger:m=>{ if(m.status==="recognizing text") prog.style.width=(m.progress*100).toFixed(0)+"%"; } })
      .then(({data})=>{
        document.getElementById("loading").style.display="none";
        const txt=data.text.trim();
        addUser("📷 已上传报告图片（识别中）");
        const t=document.createElement("div"); t.className="row ai"; t.innerHTML='<div class="bubble typing">OCR 识别结果：</div>'; 
        const box=document.createElement("div"); box.className="row ai";
        const card=document.createElement("div"); card.className="card";
        card.innerHTML=`<div class="sec-title">OCR 识别文字（请核对后系统自动提取）</div><div class="ocr-text">${escapeHtml(txt)||"（未识别到文字，请确认图片清晰度或手动粘贴）"}</div>`;
        const btn=document.createElement("button"); btn.className="btn btn-send"; btn.style.marginTop="10px"; btn.textContent="用这段文字分析";
        btn.onclick=()=>{ box.remove(); analyze(mergeIntent(txt)); };
        card.appendChild(btn); box.appendChild(card); chat.appendChild(box); scroll();
        if(txt){ analyze(mergeIntent(txt)); }
      })
      .catch(err=>{ document.getElementById("loading").style.display="none"; alert("识别失败："+err.message); });
  };
  rd.readAsDataURL(f);
  e.target.value="";
}
function mergeIntent(txt){ return txt; }
function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* 粘贴 */
function openPaste(){ document.getElementById("modal").style.display="flex"; document.getElementById("pasteArea").focus(); }
function closePaste(){ document.getElementById("modal").style.display="none"; }
function doPaste(){
  const v=document.getElementById("pasteArea").value.trim();
  if(!v){ alert("请先粘贴文字内容"); return; }
  closePaste();
  addUser("📋 已粘贴报告文字");
  analyze(v);
}
